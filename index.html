  /* ── Drag & Resize ─────────────────────────────────────── */

  .resize-handle {

  .resize-handle.resize-se { bottom: -4px; right: -4px;  width: 16px;  height: 16px; cursor: se-resize; }
  .resize-handle.resize-sw { bottom: -4px; left: -4px;   width: 16px;  height: 16px; cursor: sw-resize; }

  .window.maximized .resize-handle,

  .window {

/* Copy section URL to clipboard */
function copySectionLink(section, e){
  e.stopPropagation();
  const url = window.location.origin + window.location.pathname + '#' + section;
  navigator.clipboard.writeText(url).then(() => {
    const icon = e.target;

    icon.classList.add('copied');

        const toRow = row => `<li><span class="r-gb-nick">${escapeHtml(row.nickname)}</span><span class="r-gb-date">${formatDate(row.created_at)}</span><div class="r-gb-msg">${escapeHtml(sanitizeGuestbook(row.message))}</div></li>`;

        let bookHtml = '';
        if (Array.isArray(data) && data.length) {
          // spread entries evenly: aim for ~5 per page, but distribute cleanly
          const numPages = Math.max(1, Math.round(data.length / 5));
          const PER_PAGE = Math.ceil(data.length / numPages);
          const pages = Math.ceil(data.length / PER_PAGE);
          bookHtml = `
            <div class="gb-book">
              <ul class="r-gb-entries" id="gb-entries"></ul>
              <div class="gb-book-nav">
                <button class="gb-nav-btn" id="gb-prev">← Prev</button>
                <span class="gb-page-info" id="gb-page-info"></span>
                <button class="gb-nav-btn" id="gb-next">Next →</button>
              </div>
            </div>`;
          container.innerHTML = bookHtml + `
            <p class="r-gb-cta">Leave a little note before you go — add your digital footprint to this tiny corner of the internet 🌱</p>
            <div class="r-gb-form" id="gb-form">
              <input id="gb-nick" type="text" placeholder="Your nickname (3–20 chars)" maxlength="20" autocomplete="off" />
              <textarea id="gb-msg" placeholder="Leave a message... (2–300 chars)" maxlength="300"></textarea>
              <p class="r-gb-status dim" id="gb-link-warn" style="font-size:12px;margin:2px 0 4px;display:none;">Links will be redacted to prevent spam.</p>
              <button class="r-gb-btn" id="gb-submit">Sign guestbook →</button>
              <span class="r-gb-status" id="gb-status" style="display:none;"></span>
            </div>`;

          let page = 0;
          const renderPage = (dir) => {
            const list = document.getElementById('gb-entries');
            list.innerHTML = data.slice(page * PER_PAGE, (page + 1) * PER_PAGE).map(toRow).join('');
            if (dir) {
              list.classList.remove('gb-flip-next', 'gb-flip-prev');
              void list.offsetWidth;
              list.classList.add(dir === 'next' ? 'gb-flip-next' : 'gb-flip-prev');
            }
            document.getElementById('gb-page-info').textContent = `Page ${page + 1} of ${pages}`;
            document.getElementById('gb-prev').disabled = page === 0;
            document.getElementById('gb-next').disabled = page >= pages - 1;
          };
          renderPage(null);

          document.getElementById('gb-prev').addEventListener('click', () => { page--; renderPage('prev'); });
          document.getElementById('gb-next').addEventListener('click', () => { page++; renderPage('next'); });
        } else {
          container.innerHTML = `<p class="r-gb-status dim" style="margin-bottom:16px;">No entries yet — be the first!</p>
            <p class="r-gb-cta">Leave a little note before you go — add your digital footprint to this tiny corner of the internet 🌱</p>
            <div class="r-gb-form" id="gb-form">
              <input id="gb-nick" type="text" placeholder="Your nickname (3–20 chars)" maxlength="20" autocomplete="off" />
              <textarea id="gb-msg" placeholder="Leave a message... (2–300 chars)" maxlength="300"></textarea>
              <p class="r-gb-status dim" id="gb-link-warn" style="font-size:12px;margin:2px 0 4px;display:none;">Links will be redacted to prevent spam.</p>
              <button class="r-gb-btn" id="gb-submit">Sign guestbook →</button>
              <span class="r-gb-status" id="gb-status" style="display:none;"></span>
            </div>`;
        }

        document.getElementById('gb-msg').addEventListener('input', () => {
          const v = document.getElementById('gb-msg').value;
          const hasLink = /https?:\/\//i.test(v) || /www\.[^\s]/i.test(v) || /\b[a-zA-Z0-9._%+-]+\.[a-z]{2,}\b/i.test(v);
          document.getElementById('gb-link-warn').style.display = hasLink ? '' : 'none';
        });
        document.getElementById('gb-submit').addEventListener('click', async () => {
          const nick = (document.getElementById('gb-nick').value || '').trim();
          const msg  = (document.getElementById('gb-msg').value || '').trim();
          const statusEl = document.getElementById('gb-status');
          statusEl.className = 'r-gb-status';
          statusEl.style.display = '';
          if (!validateNickname(nick)) { statusEl.textContent = 'Nickname must be 3–20 chars: letters, numbers, spaces, _ or -'; statusEl.classList.add('err'); return; }
          if (!isClean(nick)) { statusEl.textContent = 'That nickname isn\'t allowed.'; statusEl.classList.add('err'); return; }
          if (!msg || msg.length < 2) { statusEl.textContent = 'Message too short (min 2 chars).'; statusEl.classList.add('err'); return; }
          if (msg.length > 300) { statusEl.textContent = 'Message too long (max 300 chars).'; statusEl.classList.add('err'); return; }
          if (!isClean(msg)) { statusEl.textContent = 'That message isn\'t allowed.'; statusEl.classList.add('err'); return; }
          statusEl.textContent = 'Submitting...';
          try {
            const res = await edgeFn('post-guestbook', { method: 'POST', body: JSON.stringify({ nickname: nick, message: msg }) });
            if (res.error) { statusEl.textContent = 'Error: ' + res.error; statusEl.classList.add('err'); }
            else { statusEl.textContent = '✓ Message saved! Thanks for signing.'; document.getElementById('gb-nick').value = ''; document.getElementById('gb-msg').value = ''; }
          } catch(e) { statusEl.textContent = 'Failed: ' + e.message; statusEl.classList.add('err'); }
        });
      })
      .catch(() => {
        container.innerHTML = '<p class="r-gb-status err">Guestbook unavailable.</p>';
      });
}

let windowState = 'normal'; // 'normal' | 'minimized' | 'maximized' | 'closed'

function setWindowState(state) {
  windowState = state;
  const win = document.getElementById('window');
  win.classList.remove('minimized', 'maximized', 'closed');
  if (state !== 'normal') win.classList.add(state);
  if (state === 'normal') {

    win.style.left = win.style.top = win.style.width = win.style.height = win.style.position = '';
    setTimeout(fitToViewport, 0);
  }
  safeSave('window-state', state);
}

function restoreWindow() {

  document.body.style.cursor = '';
  document.body.title = '';
  document.body.style.pointerEvents = '';
}

// ── Drag & Resize ────────────────────────────────────────────
const MIN_W = 400, MIN_H = 220;

function isMobileNow() { return window.innerWidth <= 600; }

function enterUserPositioned() {
  if (isMobileNow()) return;
  const rect = win.getBoundingClientRect();
  win.style.left   = rect.left + 'px';
  win.style.top    = rect.top  + 'px';
  win.style.width  = rect.width  + 'px';
  win.style.height = rect.height + 'px';
  win.classList.add('user-positioned');
}

// Drag via title bar
{
  const bar = document.querySelector('.bar');
  bar.classList.add('draggable');
  let startX, startY, startL, startT;

  bar.addEventListener('mousedown', e => {
    if (isMobileNow()) return;
    if (e.target.closest('button')) return;
    if (windowState === 'maximized' || windowState === 'minimized') return;
    e.preventDefault();
    if (!win.classList.contains('user-positioned')) enterUserPositioned();
    startX = e.clientX; startY = e.clientY;
    startL = parseFloat(win.style.left); startT = parseFloat(win.style.top);
    win.classList.add('dragging');

    function onMove(e) {
      win.style.left = (startL + e.clientX - startX) + 'px';
      win.style.top  = Math.max(0, startT + e.clientY - startY) + 'px';
    }
    function onUp() {
      win.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// Resize via handles
document.querySelectorAll('.resize-handle').forEach(handle => {
  handle.addEventListener('mousedown', e => {
    if (isMobileNow()) return;
    if (windowState === 'maximized' || windowState === 'minimized') return;
    e.preventDefault();
    if (!win.classList.contains('user-positioned')) enterUserPositioned();

    const dir = handle.className.replace('resize-handle resize-', '');
    const startX = e.clientX, startY = e.clientY;
    const startL = parseFloat(win.style.left),  startT = parseFloat(win.style.top);
    const startW = parseFloat(win.style.width), startH = parseFloat(win.style.height);
    win.classList.add('resizing');

    function onMove(e) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      let l = startL, t = startT, w = startW, h = startH;
      if (dir.includes('e'))  w = Math.max(MIN_W, startW + dx);
      if (dir.includes('s'))  h = Math.max(MIN_H, startH + dy);
      if (dir.includes('w')) { w = Math.max(MIN_W, startW - dx); if (w > MIN_W) l = startL + dx; }
      if (dir.includes('n')) { h = Math.max(MIN_H, startH - dy); if (h > MIN_H) t = startT + dy; }
      win.style.left = l + 'px'; win.style.top  = t + 'px';
      win.style.width = w + 'px'; win.style.height = h + 'px';
    }
    function onUp() {
      win.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
});

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

const CHIP_NAMES = ['about','whyhireme','skills','projects','strengths','contact','cv','testimonials','guestbook','quiz','adventure','neofetch','theme','help'];

/* ponytail: single source of truth for chips — boot + help both call this */
function renderChips(){

function print(html, cls){
  const d = el('div', 'line fade-in' + (cls ? ' ' + cls : ''), html);
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
  return d;
}
function normalizePath(p) {
  const stack = [];
  for (const part of p.split('/').filter(Boolean)) {
    if (part === '..') stack.pop();
    else if (part !== '.') stack.push(part);
  }
  return '/' + stack.join('/') || '/';
}
function shortPath(dir) {
  let p = dir;
  if (p.startsWith('/home/emily/portfolio')) p = '~' + p.slice('/home/emily/portfolio'.length);
  else if (p.startsWith('/home/emily')) p = '~' + p.slice('/home/emily'.length);
  return p || '~';
}

/* Shared prompt markup so the echoed prompt, boot prompt, and input bar all match. */
function promptHtml(path){
  return `<span class="prompt">${CONFIG.user}@${CONFIG.host}<span style="color:inherit">:</span></span><span class="path">${escapeHtml(path)}</span><span class="prompt">$</span>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function validateNickname(nick){ return nick && nick.length >= 3 && nick.length <= 20 && /^[a-zA-Z0-9 _-]+$/.test(nick); }
function hasHelpFlag(argv){ return argv.includes('-h') || argv.includes('--help') || argv.includes('-help'); }
function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function formatDate(str){ return new Date(str).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
function safeSave(key, val){ try { localStorage.setItem(key, val); } catch(e){} }
function safeLoad(key, def){ try { return localStorage.getItem(key) ?? def; } catch(e){ return def; } }
function armRestore(target){ setTimeout(() => { (target || document.body).addEventListener('click', restoreWindow, { once: true }); }, 100); }
function registerEgg(name){ if (huntState.sessionId) edgeFn('register-egg', { method: 'POST', body: JSON.stringify({ sessionId: huntState.sessionId, egg: name }) }).catch(() => {}); }

/* ponytail: truncate at ~250 chars but break at next space to avoid mid-word cuts */
function truncateAtWord(s, maxLen){
  if (s.length <= maxLen) return s;
  const cutoff = s.lastIndexOf(' ', maxLen);
  return cutoff > maxLen * 0.7 ? s.substring(0, cutoff) + '...' : s.substring(0, maxLen) + '...';
}

/* ponytail: one template, class switches between terminal/reader */
function testimonialCTA(forReader = false){
  const cls = forReader ? 'r-test-cta' : 'dim';
  const tag = forReader ? 'p' : 'span';
  const or = ' or';
  const dot = forReader ? '' : '<span class="dim">.</span>';
  return `<${tag} class="${cls}">Worked with Emily and want to add your testimonial? <a class="tlink" href="${escapeHtml(CONFIG.linkedin)}" target="_blank" rel="noopener">Add a LinkedIn recommendation</a>${or} <a class="tlink" href="mailto:${escapeHtml(CONFIG.email)}?subject=Add%20testimonial%20to%20Emily's%20portfolio">email me</a>${dot}</${tag}>`;
}

/* Sanitize guestbook messages: strip URLs and obfuscate domain patterns */
function sanitizeGuestbook(s){
  return String(s)
    .replace(/https?:\/\/[^\s<]+/gi, '[link removed]')
    .replace(/www\.[^\s<]+/gi, '[link removed]')
    .replace(/\b[a-zA-Z0-9_%+-]+(?:\.[a-zA-Z0-9_%+-]+)*\.[a-z]{2,}\b/gi, match => {
      // Obfuscate .com, .org, .net, etc. to prevent clickable links
      return match.replace(/\./g, '[.]');
    });
}

/* =========================================================
   Math evaluator — safe subset: + - * / % ( ) and spaces
   ========================================================= */
function tryMath(raw) {
  const expr = raw.trim();
  if (!/^[\d\s\+\-\*\/\%\.\(\)]+$/.test(expr)) return null;
  if (!/[\+\-\*\/\%]/.test(expr)) return null;
  try {
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + expr + ')')();
    if (typeof result === 'number' && isFinite(result)) return result;
  } catch(e) {}
  return null;
}

        const next = argv[i + 1];

          i++; // skip the number

        }

    if (showAll) {

  cd(args){
    const argv = (args || '').trim().split(/\s+/).filter(Boolean);
    const target = argv[0] || '~';
    const setDir = d => {
      currentDir = d;
      document.querySelector('#inputRow .path').textContent = shortPath(d);
    };

    if (target === '~' || target === '$HOME') { setDir('/home/emily/portfolio'); return; }
    if (target === '-') { print('<span class="yellow">cd: OLDPWD not set</span>'); return; }
    if (target === '.' || target === './') return;

    if (target === '..') {
      const parts = currentDir.split('/').filter(Boolean);
      parts.pop();
      setDir('/' + parts.join('/') || '/');
      return;
    }

    let newPath = target.startsWith('/') ? target : (currentDir === '/' ? '/' + target : currentDir + '/' + target);
    newPath = newPath.replace(/\/+/g, '/').replace(/\/$/, '') || '/';

    if (FS_DIRS[newPath] !== undefined) {
      setDir(newPath);
    } else {
      print(`<span class="yellow">cd: ${escapeHtml(target)}: No such directory</span>`);
    }
  },
  ls(args){
    const argv = (args || '').trim().split(/\s+/).filter(Boolean);
    const joined = argv.join('');
    // ponytail: check flags by character presence, not full permutation
    const showAll = joined.includes('a');
    const longFormat = joined.includes('l');
    const humanReadable = joined.includes('h');

    const hidden = [
      { name: '.config', type: 'dir', size: '4.0K' },
      { name: '.secrets', type: 'file', size: '64' },
    ];

    const files = (FS_CONTENTS[currentDir] || []).filter(f => showAll || !f.name.startsWith('.'));
    const allFiles = showAll ? [...hidden, ...files] : files;

    if (longFormat) {
      let total = 0;
      allFiles.forEach(f => {
        const sizeNum = parseFloat(f.size);
        total += sizeNum;
      });
      print(`total ${humanReadable ? Math.round(total) + 'K' : Math.round(total * 1024)}`);
      blank();
      allFiles.forEach(f => {
        const perms = f.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--';
        const size = humanReadable ? f.size : (f.type === 'dir' ? '4096' : Math.round(parseFloat(f.size) * 1024));
        print(`<span class="${f.type === 'dir' ? 'cyan' : 'fg'}">${perms}</span>  <span class="dim">${size}</span>  ${f.name}`);
      });
    } else {
      allFiles.forEach(f => {
        if (f.type === 'dir') {
          print(`<span class="cyan b">${f.name}</span>`);
        } else {
          print(f.name);
        }
      });
    }

  cat(args){
    const file = (args || '').trim().split(/\s+/)[0];
    if (!file) { print('🐱'); return; }

    if (file === '.secrets' || file === './.secrets') { print('<span class="yellow">Permission denied</span>'); return; }

    const expanded = file.startsWith('~/') ? '/home/emily/portfolio' + file.slice(1) : file === '~' ? '/home/emily/portfolio' : file;
    const abs  = normalizePath(expanded.startsWith('/') ? expanded : (currentDir === '/' ? '/' + expanded : currentDir + '/' + expanded));
    const dir  = abs.slice(0, abs.lastIndexOf('/')) || '/';
    const name = abs.slice(abs.lastIndexOf('/') + 1);
    const entry = (FS_CONTENTS[dir] || []).find(f => f.name.toLowerCase() === name.toLowerCase());

    if (!entry)              { print(`<span class="yellow">cat: ${escapeHtml(file)}: No such file or directory</span>`); return; }
    const realAbs = dir + '/' + entry.name;
    if (entry.type === 'dir'){
      const readme = FILE_CONTENT[realAbs + '/README.md'];
      if (readme) { readme.forEach(line => print(line)); return; }
      print(`<span class="yellow">cat: ${escapeHtml(file)}: Is a directory</span>`); return;
    }

    const content = FILE_CONTENT[realAbs] || ['<span class="dim">(empty)</span>'];
    if (content[0] === '__EASTER_EGG__') {
      commands['easter-egg']();
      if (huntState.active && huntState.phase === 'hunting' && !huntState.found.has('fs-egg')) {
        huntState.found.add('fs-egg');
        registerEgg('fs-egg');
        const n = huntState.found.size;
        blank();
        print(`<span class="green b">🥚 Egg found! [${n}/${huntState.target}]</span>`);
        if (n >= huntState.target) finishEggHunt();
      }
      return;
    }
    content.forEach(line => print(line));
  },

  'easter-egg'(){
    const frames = [
      ['  (\\(\\  ', '  ( -.-)  🥚', "  o_(\")(\")", ''],
      ['  (\\(\\  ', '  ( -.-)  🥚', "  o_(\")(\")", '  *hop*'],
      ['  (\\(\\     ', '  ( -.-)  🥚', "  o_(\")(\")", '  *hop hop*'],
      ['    (\\(\\   ', '    ( -.-)🥚', "    o_(\")(\")", '  *hop hop hop*'],
      ['    (\\(\\   ', '    ( ^.^)🥚', "    o_(\")(\")", '  *sniff sniff*'],
      ['    (\\(\\   ', '    ( ^.^) 🌟', "    o_(\")(\")", '  *picks it up!*'],
      ['    (\\(\\   ', '    ( ^w^) 🎉', "    o_(\")(\")", '  You found an easter egg!'],
    ];

    div.style.fontFamily = 'inherit';
    div.style.whiteSpace = 'pre';

        blank();
      }
    }, 320);

  async _startQuiz(sub){
    let category = null, difficulty = null, label = 'Mixed';
    if (sub === 'emily') { category = 'emily'; label = 'Emily (exclusive)'; }
    else if (sub === 'easy' || sub === 'medium' || sub === 'hard') { difficulty = sub; label = sub.charAt(0).toUpperCase() + sub.slice(1); }
    else if (sub === 'mixed' || sub === '4') { label = 'Mixed'; }
    else if (sub === '1') { difficulty = 'easy';   label = 'Easy'; }
    else if (sub === '2') { difficulty = 'medium'; label = 'Medium'; }
    else if (sub === '3') { difficulty = 'hard';   label = 'Hard'; }
    else if (sub === '5') { category = 'emily';    label = 'Emily (exclusive)'; }
    else if (sub) { category = sub; label = sub.charAt(0).toUpperCase() + sub.slice(1); }
    print(`<span class="dim">$ starting trivia quiz...</span>`);
    print('<span class="dim">Fetching questions from database...</span>');
    try {
      let url = 'start-quiz';
      const params = [];
      if (category)  params.push(`category=${encodeURIComponent(category)}`);
      if (difficulty) params.push(`difficulty=${encodeURIComponent(difficulty)}`);
      if (params.length) url += '?' + params.join('&');
      const data = await edgeFn(url, { method: 'POST' });
      if (data.error) { print(`<span class="red">Error: ${escapeHtml(data.error)}</span>`); return; }
      quizState.active = true; quizState.phase = 'playing';
      quizState.sessionId = data.sessionId; quizState.questions = data.questions;
      quizState.currentQ = 0; quizState.answers = []; quizState.startTime = Date.now();
      quizState.quizCategory = data.category || category || 'mixed';
      quizState.quizDifficulty = data.difficulty || difficulty || 'mixed';
      blank();
      print(`<span class="accent b">Trivia Quiz</span> <span class="dim">— ${data.questions.length} questions | ${label}</span>`);
      print('<span class="dim">Type a, b, c, or d to answer. Type quit to abandon.</span>');
      blank();
      showQuizQuestion();
    } catch(e) { print(`<span class="red">Failed to start quiz: ${escapeHtml(e.message)}</span>`); }
  },

/* =========================================================
   Autocomplete + fuzzy matching
   ========================================================= */
const COMMANDS = Object.keys(commands);
const ghost = document.getElementById('ghost');
const hint  = document.getElementById('hint');

function fuzzyScore(query, target){
  query = query.toLowerCase(); target = target.toLowerCase();
  if (!query) return 0;
  let qi = 0, score = 0, prev = -2;
  for (let ti = 0; ti < target.length && qi < query.length; ti++){
    if (target[ti] === query[qi]){
      score += 1;
      if (ti === 0) score += 6;
      if (ti === prev + 1) score += 4;
      prev = ti; qi++;
    }
  }
  if (qi < query.length) return -1;
  score -= (target.length - query.length) * 0.15;
  return score;
}

function getMatches(input){
  const q = (input || '').trim().toLowerCase();
  if (!q) return [];
  return COMMANDS
    .map(name => ({ name, score: fuzzyScore(q, name), prefix: name.startsWith(q) }))
    .filter(m => m.score >= 0)
    .sort((a, b) => (b.prefix - a.prefix) || (b.score - a.score) || (a.name.length - b.name.length));
}

function getFsCompletions(v) {
  const lower = v.toLowerCase();
  const fsMatch = lower.match(/^(cat|cd)\s+(.*)/);
  if (!fsMatch) return null;
  const cmd = fsMatch[1];
  const rawPartial = fsMatch[2];
  const partial = rawPartial.startsWith('~/') ? '/home/emily/portfolio' + rawPartial.slice(1) : rawPartial === '~' ? '/home/emily/portfolio' : rawPartial;
  const lastSlash = partial.lastIndexOf('/');
  const dir = lastSlash >= 0
    ? normalizePath(partial.startsWith('/') ? partial.slice(0, lastSlash) || '/' : currentDir + '/' + partial.slice(0, lastSlash))
    : currentDir;
  const stub = lastSlash >= 0 ? partial.slice(lastSlash + 1) : partial;
  const prefix = lastSlash >= 0 ? partial.slice(0, lastSlash + 1) : '';
  const entries = FS_CONTENTS[dir] || [];
  const matches = entries
    .filter(e => cmd === 'cd' ? e.type === 'dir' : true)
    .filter(e => e.name.startsWith(stub))
    .map(e => cmd + ' ' + prefix + e.name + (e.type === 'dir' ? '/' : ''));
  return matches.length ? matches : null;
}

function updateGhost(){
  const v = cmdline.value;
  ghost.innerHTML = ''; hint.innerHTML = '';
  if (!v.trim()) return;
  const fs = getFsCompletions(v);
  if (fs) {
    if (fs.length === 1 && fs[0] !== v) {
      ghost.innerHTML = `<span class="gt">${escapeHtml(v)}</span>${escapeHtml(fs[0].slice(v.length))}`;
      hint.innerHTML = '<span class="dim">↹ tab</span>';
    } else if (fs.length > 1) {
      hint.innerHTML = '<span class="dim">↹ tab</span>';
    }
    return;
  }
  const m = getMatches(v);
  if (!m.length) return;
  const best = m[0];
  if (best.prefix && best.name !== v.trim().toLowerCase()){
    ghost.innerHTML = `<span class="gt">${escapeHtml(v)}</span>${escapeHtml(best.name.slice(v.length))}`;
    hint.innerHTML = '<span class="dim">↹ tab</span>';
  } else if (!best.prefix){
    hint.innerHTML = `<span class="dim">↹ ${escapeHtml(best.name)}?</span>`;
  }
}

let tab = { active: false, list: [], idx: -1 };
function onTab(){
  if (!tab.active){
    const fs = getFsCompletions(cmdline.value);
    if (fs && fs.length) {
      tab = { active: true, list: fs, idx: -1 };
    } else {
      const m = getMatches(cmdline.value);
      if (!m.length) return;
      tab = { active: true, list: m.map(x => x.name), idx: -1 };
    }
  }
  tab.idx = (tab.idx + 1) % tab.list.length;
  cmdline.value = tab.list[tab.idx];
  updateGhost();
}

function resolve(raw){
  const v = (raw || '').trim().toLowerCase();
  if (!v) return null;
  const mathResult = tryMath(v);
  if (mathResult !== null) return { name: '__math__', result: mathResult };
  const easterKeys = Object.keys(EASTER_EGGS).sort((a,b) => b.length - a.length);
  for (const ek of easterKeys) {
    if (v === ek || v.startsWith(ek + ' ')) {
      return { name: EASTER_EGGS[ek], corrected: false, easter: true };
    }
  }
  if (commands[v]) return { name: v, corrected: false };
  const firstWord = v.split(/\s+/)[0];
  if (firstWord !== v && commands[firstWord]) return { name: firstWord, corrected: false, hasArgs: true };
  const m = getMatches(v);
  return m.length ? { name: m[0].name, corrected: true } : null;
}

function runCommand(raw){
  const cmd = (raw || '').trim();
  
  // Handle !! and !N (repeat from history)
  if (cmd === '!!' || /^!\d+$/.test(cmd)) {
    const idx = cmd === '!!' ? commandHistory.length - 1 : parseInt(cmd.slice(1), 10) - 1;
    if (commandHistory[idx] !== undefined) {
      const target = commandHistory[idx];
      printPromptEcho(cmd);
      print('<span class="dim">' + escapeHtml(target) + '</span>');
      runCommand(target);
    } else {
      printPromptEcho(cmd);
      print(`<span class="err">${escapeHtml(cmd)}: event not found</span>`);
    }
    return;
  }

  printPromptEcho(cmd);
  if (!cmd) return;
  if (quizState.tailInterval) { clearInterval(quizState.tailInterval); quizState.tailInterval = null; }

  // Add to history
  if (cmd !== 'history' && cmd !== 'clear' && cmd !== '!!' && !/^!\d+$/.test(cmd)) {
    commandHistory.push(cmd);
    historyIndex = -1;
  }

  const r = resolve(cmd);
  if (r){
    if (r.name === '__math__') {
      const val = Number.isInteger(r.result) ? r.result : parseFloat(r.result.toPrecision(12));
      print(`<span class="accent">${escapeHtml(String(val))}</span>`);
    } else {
      if (r.corrected) print(`<span class="dim">≈ assuming <span class="accent">${escapeHtml(r.name)}</span></span>`);
      const cmdFn = commands[r.name];
      if (cmdFn) {
        const args = cmd.toLowerCase().replace(new RegExp('^' + r.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*'), '');
        cmdFn(args || undefined);
      }
      if (huntState.active && huntState.phase === 'hunting'
          && r.easter && HUNT_EGGS.has(r.name)
          && !huntState.found.has(r.name)) {
        huntState.found.add(r.name);
        registerEgg(r.name);
        const n = huntState.found.size;
        blank();
        print(`<span class="green b">🥚 Egg found! [${n}/${huntState.target}]</span>`);
        if (n >= huntState.target) finishEggHunt();
      }
    }
  } else {
    print(`<span class="red">command not found: ${escapeHtml(cmd)}</span> — type <span class="accent">help</span>`);
  }
  blank();
}

cmdline.addEventListener('input', () => { tab.active = false; updateGhost(); });
cmdline.addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); onTab(); return; }
  if (e.key === 'ArrowRight' && cmdline.selectionStart === cmdline.value.length){
    const m = getMatches(cmdline.value);
    if (m.length && m[0].prefix && m[0].name !== cmdline.value.trim().toLowerCase()){
      e.preventDefault(); cmdline.value = m[0].name; tab.active = false; updateGhost(); return;
    }
  }
  if (e.key === 'Enter'){
    const v = cmdline.value;
    cmdline.value = ''; tab.active = false; updateGhost();

    // ── Adventure mode ──
    if (adventureState.active) {
      const trimmed = v.trim();
      const lower = trimmed.toLowerCase();

      if (adventureState.phase === 'guided-awaitEnter') {
        if (trimmed) printPromptEcho(trimmed);
        showAdventureStep(adventureState.step + 1);
        return;
      }

      if (adventureState.phase === 'guided-awaitCmd') {
        const expected = ADVENTURE_STEPS[adventureState.step].cmd;
        printPromptEcho(trimmed);
        if (lower === expected.toLowerCase()) { runAdventureStep(adventureState.step); }
        else if (lower === 'quit' || lower === 'exit') { abandonAdventure(); }
        else { print(`<span class="dim">Tip: type <span class="accent">${escapeHtml(expected)}</span> ↩ — or <span class="accent">quit</span> to exit.</span>`); }
        return;
      }

      if (adventureState.phase === 'free') {
        if (lower === 'quit' || lower === 'exit') { printPromptEcho(trimmed); abandonAdventure(); return; }
        if (lower === 'clear') { commands.clear(); return; }
        printPromptEcho(trimmed);
        handleFreeCmd(trimmed);
        return;
      }
    }

    if (quizState.phase === 'picking') {
      const pick = v.trim().toLowerCase();
      printPromptEcho(pick);
      if (['1','2','3','4','5','easy','medium','hard','mixed','emily'].includes(pick)) { quizState.phase = 'idle'; commands._startQuiz(pick); }
      else if (pick === 'quit' || pick === 'cancel') { quizState.phase = 'idle'; print('<span class="dim">Cancelled.</span>'); }
      else { print('<span class="yellow">Pick 1–5, or type easy / medium / hard / mixed / emily</span>'); }
      return;
    }

    if (quizState.phase === 'playing') {
      const ans = v.trim().toLowerCase();
      if (ans === 'quit') { printPromptEcho('quit'); print('<span class="yellow">Quiz abandoned.</span>'); resetQuizState(); blank(); }
      else if (['a','b','c','d'].includes(ans)) { printPromptEcho(ans); submitQuizAnswer(ans); }
      else { printPromptEcho(v); print('<span class="yellow">Type a, b, c, or d to answer. Type quit to abandon.</span>'); }
      return;
    }

    if (huntState.phase === 'nickname') {
      const nick = v.trim(); printPromptEcho(nick);
      cmdline.value = '';
      if (nick.toLowerCase() === 'quit' || nick.toLowerCase() === 'skip') {
        huntState.active = false; huntState.phase = 'idle';
        print('<span class="dim">Score not saved. Type <span class="accent">egghunt</span> to try again.</span>');
        blank(); return;
      }
      if (!/^[a-zA-Z0-9 _-]{3,20}$/.test(nick) || !isClean(nick)) {
        print('<span class="yellow">Invalid nickname. 3–20 chars: letters, numbers, spaces, _ or -</span>');
        print('Enter your nickname (or type <span class="accent">skip</span> to not save):');
        return;
      }
      submitEggHunt(nick); return;
    }

    if (quizState.phase === 'nickname') {
      const nick = v.trim(); printPromptEcho(nick);
      if (!validateNickname(nick)) { print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>'); return; }
      if (!isClean(nick)) { print('<span class="yellow">That nickname isn\'t allowed.</span>'); return; }
      finishQuiz(nick); return;
    }

    if (quizState.phase === 'review') {
      const ans = v.trim().toLowerCase();
      printPromptEcho(ans);
      if (ans === '' || ans === 'y' || ans === 'yes') {
        showWrongAnswers();
      } else {
        print('<span class="dim">Skipping review.</span>');
        blank();
        print('<span class="dim">Type <span class="accent">leaderboard</span> to see the rankings!</span>');
      }
      quizState.phase = 'done';
      resetQuizState();
      return;
    }

    if (quizState.gbStep === 'nickname') {
      const nick = v.trim(); printPromptEcho(nick);
      if (!validateNickname(nick)) { print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>'); return; }
      if (!isClean(nick)) { print('<span class="yellow">That nickname isn\'t allowed.</span>'); return; }
      quizState.gbNickname = nick; quizState.gbStep = 'message';
      print('Enter your message (2–300 chars):'); return;
    }
    if (quizState.gbStep === 'message') {
      const msg = v.trim(); printPromptEcho(msg);
      if (!msg || msg.length < 2) { print('<span class="yellow">Message too short (min 2 chars).</span>'); return; }
      if (msg.length > 300) { print('<span class="yellow">Message too long (max 300 chars).</span>'); return; }
      if (!isClean(msg)) { print('<span class="yellow">That message isn\'t allowed.</span>'); return; }
      if (/https?:\/\//i.test(msg) || /www\.[^\s]/i.test(msg) || /\b[a-zA-Z0-9._%+-]+\.[a-z]{2,}\b/i.test(msg)) print('<span class="dim">Note: links will be redacted to prevent spam.</span>');
      quizState.gbMessage = msg; submitGuestbook(); return;
    }

    if (v.trim() && v.trim() !== '!!' && !/^!\d+$/.test(v.trim())) { commandHistory.push(v); historyIndex = commandHistory.length; }
    runCommand(v);
  } else if (e.key === 'ArrowUp'){
    if (historyIndex > 0){ historyIndex--; cmdline.value = commandHistory[historyIndex]; tab.active = false; updateGhost(); e.preventDefault(); }
  } else if (e.key === 'ArrowDown'){
    if (historyIndex < commandHistory.length-1){ historyIndex++; cmdline.value = commandHistory[historyIndex]; }
    else { historyIndex = commandHistory.length; cmdline.value = ''; }
    tab.active = false; updateGhost();
  }
});

/* =========================================================
   Mobile keyboard handling — visual viewport pinning
   =========================================================
   Problem: when the on-screen keyboard opens, browsers either
   (a) shrink the layout viewport (Chrome/Android) or
   (b) keep the layout viewport and shift it (Safari/iOS).
   In both cases window.visualViewport reflects the true
   visible area. We pin the .window to that rectangle so it
   always fills exactly the available space, and we scroll
   the .screen to the bottom so the latest output stays in view.
   ========================================================= */
const vv = window.visualViewport;

function fitToViewport() {
  if (window.innerWidth > 600) {
    /* Desktop: let CSS handle sizing unless user has manually positioned */
    if (!win.classList.contains('user-positioned')) {
      win.style.position = '';
      win.style.top      = '';
      win.style.left     = '';
      win.style.width    = '';
      win.style.height   = '';
    }
    return;
  }

  if (vv) {
    /* Pin window to the visual viewport's current position and size.
       This handles both shrink-viewport (Chrome) and shift-viewport
       (Safari) keyboard behaviours in one shot. */
    win.style.position = 'fixed';
    win.style.top      = vv.offsetTop  + 'px';
    win.style.left     = vv.offsetLeft + 'px';
    win.style.width    = vv.width      + 'px';
    win.style.height   = vv.height     + 'px';
  } else {
    /* Fallback for browsers without visualViewport API */
    win.style.position = 'fixed';
    win.style.top      = '0';
    win.style.left     = '0';
    win.style.width    = '100%';
    win.style.height   = window.innerHeight + 'px';
  }

  /* Always keep latest terminal output visible */
  if (root.getAttribute('data-view') === 'terminal') {
    screen.scrollTop = screen.scrollHeight;
  }
}

if (vv) {
  vv.addEventListener('resize', fitToViewport);
  vv.addEventListener('scroll', fitToViewport);
}
window.addEventListener('resize',            fitToViewport);
window.addEventListener('orientationchange', () => setTimeout(fitToViewport, 300));
fitToViewport();

cmdline.addEventListener('focus', () => {
  /* Two-pass: fire once immediately (for browsers that resize before focus
     completes) and again after the keyboard animation finishes (~300–400 ms). */
  setTimeout(() => { fitToViewport(); screen.scrollTop = screen.scrollHeight; }, 100);
  setTimeout(() => { fitToViewport(); screen.scrollTop = screen.scrollHeight; }, 420);
});

/* =========================================================
   Boot sequence
   ========================================================= */
let skip = false;
const isMobile = () => window.innerWidth <= 600;
/* Typing speed per character — comfortably readable on mobile */
const CHAR_MS = () => isMobile() ? 55 : 16;

function typeLine(text, cls, prefix){
  prefix = prefix || '';
  return new Promise(res => {
    const node = print('', cls);
    const cursor = el('span','cursor');
    node.innerHTML = prefix;
    node.appendChild(cursor);
    let i = 0;
    (function step(){
      if (skip){ node.innerHTML = prefix + escapeHtml(text); res(); return; }
      if (i <= text.length){
        node.innerHTML = prefix + escapeHtml(text.slice(0,i));
        node.appendChild(cursor);
        screen.scrollTop = screen.scrollHeight;
        i++;
        setTimeout(step, CHAR_MS());
      } else { node.innerHTML = prefix + escapeHtml(text); res(); }
    })();
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, skip ? 0 : ms)); }

/* Print a line then pause so the reader can absorb it before the next appears.
   Optional `pause` arg overrides the default mobile delay. */
function printLine(html, cls, pause){
  print(html, cls);
  screen.scrollTop = screen.scrollHeight;
  const ms = pause !== undefined ? pause : (isMobile() ? 1000 : 0);
  return ms > 0 ? wait(ms) : Promise.resolve();
}

function handleFreeCmd(raw) {
  const v = raw.trim();
  const lower = v.toLowerCase();
  const killed = adventureState.killed;

  // cd
  const CD_MAP = {
    '': '/home/emily', '~': '/home/emily',
    '/home/emily': '/home/emily', '/home/emily/': '/home/emily',
    '/var/log': '/var/log', '/var/log/': '/var/log',
    '/var': '/var', '/var/': '/var',
    '/var/log/nginx': '/var/log/nginx', '/var/log/nginx/': '/var/log/nginx',
    '/app': '/app', '/app/': '/app',
    '/': '/',
  };
  if (lower === 'cd' || lower.startsWith('cd ')) {
    const arg = lower === 'cd' ? '' : v.slice(3).trim();
    if (arg in CD_MAP) {
      adventureState.mockCwd = CD_MAP[arg]; syncAdventureInputPrompt(); return;
    } else if (arg === '..' || arg === '../') {
      const parts = adventureState.mockCwd.split('/').filter(Boolean);
      parts.pop();
      adventureState.mockCwd = parts.length ? '/' + parts.join('/') : '/';
      syncAdventureInputPrompt(); return;
    } else {
      print(`<span class="dim">bash: cd: ${escapeHtml(arg)}: No such file or directory</span>`); return;
    }
  }

  // pwd
  if (lower === 'pwd') { print(adventureState.mockCwd); return; }

  // whoami / id
  if (lower === 'whoami') { print('emily'); return; }
  if (lower === 'id') { print('uid=1001(emily) gid=1001(emily) groups=1001(emily),4(adm),27(sudo),1002(docker)'); return; }

  // hostname
  if (lower === 'hostname' || lower === 'hostname -f') { print('prod-server-01'); return; }

  // uname
  if (lower.startsWith('uname')) {
    print('Linux prod-server-01 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64 GNU/Linux'); return;
  }

  // cat /etc/os-release
  if (lower.includes('os-release') || lower === 'lsb_release -a') {
    ['NAME="Ubuntu"','VERSION="22.04.3 LTS (Jammy Jellyfish)"','ID=ubuntu','PRETTY_NAME="Ubuntu 22.04.3 LTS"'].forEach(l => print(`<span class="dim">${l}</span>`)); return;

  }

  // dmesg
  if (lower.startsWith('dmesg')) {
    if (killed) {
      ['<span class="dim">[3889234.112] OOM killer not invoked</span>','<span class="yellow">[3889235.881] node[12847]: segfault at 0 ip 0000... (signal 9, SIGKILL)</span>','<span class="dim">[3889235.882] audit: type=1701 auid=1001 pid=12847 comm="node" sig=9</span>'].forEach(l => print(l));
    } else {
      ['<span class="dim">[3889180.019] nf_conntrack: table full, dropping packet</span>','<span class="red">[3889181.774] TCP: too many orphaned sockets</span>','<span class="red">[3889182.100] possible SYN flooding on port 3000</span>'].forEach(l => print(l));
    }
    return;
  }

  // cat /proc/loadavg
  if (lower === 'cat /proc/loadavg') {
    print(killed ? '<span class="dim">0.43 3.21 9.87 2/312 14921</span>' : '<span class="red">18.43 17.92 15.11 312/312 12847</span>'); return;
  }

  // ls
  if (lower === 'ls' || lower === 'ls -la' || lower === 'ls -l' || lower === 'ls -a' || lower === 'ls -lah' || lower === 'ls -alh') {
    const long = lower.includes('-l') || lower.includes('-a');
    if (adventureState.mockCwd === '/var/log') {
      if (long) {
        ['<span class="dim">total 164</span>','<span class="dim">drwxr-xr-x  5 root  root   4096 Nov 14 14:20 .</span>','<span class="dim">drwxr-xr-x 14 root  root   4096 Nov 10 09:15 ..</span>','<span class="dim">drwxr-xr-x  2 root  adm    4096 Nov 14 14:23 <span class="cyan">nginx</span></span>','<span class="dim">-rw-r--r--  1 emily emily 128432 Nov 14 14:23 production.log</span>','<span class="dim">-rw-r-----  1 root  adm   32768 Nov 14 14:20 syslog</span>'].forEach(l => print(l));
      } else { print('<span class="cyan">nginx</span>  production.log  syslog'); }
    } else {
      if (long) {
        ['<span class="dim">total 32</span>','<span class="dim">drwxr-xr-x 5 emily emily 4096 Nov 14 14:21 .</span>','<span class="dim">drwxr-xr-x 3 root  root  4096 Nov 10 09:00 ..</span>','<span class="dim">drwxr-xr-x 8 emily emily 4096 Nov 14 12:00 <span class="cyan">app</span></span>','<span class="dim">-rw-r--r-- 1 emily emily  220 Nov 10 09:00 .bash_logout</span>','<span class="dim">lrwxrwxrwx 1 emily emily   32 Nov 14 09:00 production.log -> /var/log/production.log</span>'].forEach(l => print(l));
      } else { print('<span class="cyan">app</span>  .bash_logout  .bashrc  production.log'); }
    }
    return;
  }
  if (lower === 'ls /var/log' || lower === 'ls /var/log/') {
    print('<span class="cyan">nginx</span>  production.log  syslog'); return;
  }

  // uptime
  if (lower === 'uptime') {
    if (!killed) {
      print(` ${new Date().toLocaleTimeString()} up 47 days,  3:21,  2 users,  load average: <span class="red b">18.43</span><span class="dim">, 17.92, 15.11</span>`);
    } else {
      print(` ${new Date().toLocaleTimeString()} up 47 days,  3:25,  2 users,  load average: <span class="green">0.43</span><span class="dim">, 3.21, 9.87</span>`);
      blank();
      print('<span class="green">✓ Load average has returned to normal.</span>');
      endAdventure('free');
    }
    return;
  }

  // ps aux / top / htop
  if (lower === 'ps aux' || lower === 'ps' || lower === 'top' || lower === 'htop' || lower === 'ps -ef' || lower === 'ps -aux') {
    print('<span class="dim">USER         PID  %CPU  %MEM   VSZ    RSS  COMMAND</span>');
    if (!killed) print('<span class="red b">emily      12847 892.1   0.3  45120  6840  node /app/worker.js</span>');
    ['<span class="dim">emily       1024   2.1   8.4 892344 89432  node /app/server.js</span>','<span class="dim">root         889   0.8   0.1  12324  2840  nginx: master process</span>','<span class="dim">www-data     891   0.4   0.1  12588  2960  nginx: worker process</span>','<span class="dim">emily       2041   0.2   0.1   8912  2240  sshd: emily@pts/0</span>','<span class="dim">emily       2042   0.1   0.0   4456  1920  bash</span>'].forEach(l => print(l));
    if (killed) { blank(); print('<span class="dim">(No runaway process — looks clean.)</span>'); }
    return;
  }

  // kill -9 12847 (the right one)
  if (lower === 'kill -9 12847' || lower === 'kill 12847' || lower === 'kill -15 12847' || lower === 'pkill -9 node' || lower === 'pkill node') {
    if (killed) { print('<span class="dim">kill: (12847): No such process</span>'); return; }
    adventureState.killed = true;
    print('<span class="dim">[1]+  Killed                  node /app/worker.js</span>');
    blank();
    print('<span class="yellow">✓ Process terminated. Now verify the server is recovering.</span>');
    print('<span class="dim">Try: uptime  or  curl localhost:3000/health</span>');
    return;
  }

  // kill with wrong PID
  if (/^kill\b/.test(lower)) {
    const m = v.match(/\d+/);
    if (m && m[0] !== '12847') { print(`<span class="dim">kill: (${m[0]}): No such process</span>`); return; }
  }

  // grep
  if (lower.startsWith('grep') || lower.startsWith('egrep') || lower.startsWith('zgrep')) {
    if (lower.includes('error') || lower.includes('ERROR')) {
      if (!killed) {
        ['<span class="red">[14:23:44] ERROR  DB connection pool exhausted (50/50 in use)</span>','<span class="red">[14:23:48] ERROR  POST /api/data — timeout after 30000ms</span>','<span class="red">[14:23:51] ERROR  POST /api/data — timeout after 30000ms</span>'].forEach(l => print(l));
      } else {
        print('<span class="dim">[14:24:03] INFO   Health check: OK ✓  (no new errors)</span>');
      }
    } else if (lower.includes('12847')) {
      if (!killed) print('<span class="red">emily     12847 892.1   0.3  45120  6840  node /app/worker.js</span>');
      else print('<span class="dim">(no output)</span>');
    } else {
      print('<span class="dim">(no matching lines)</span>');
    }
    return;
  }

  // nginx logs
  if (lower.includes('nginx') && /^(tail|cat|less|more)/.test(lower)) {
    ['<span class="dim">2024/11/14 14:21:33 [error] 891#891: *18842 connect() failed (111: Connection refused)</span>','<span class="red">2024/11/14 14:21:33 [error] *18843 upstream timed out (110) while reading response header</span>','<span class="red">2024/11/14 14:21:34 [error] *18844 upstream timed out (110) while reading response header</span>','<span class="red">2024/11/14 14:21:35 [error] *18901 connect() failed (111: Connection refused)</span>'].forEach(l => print(l));
    if (killed) { blank(); print('<span class="dim">2024/11/14 14:24:10 [notice] 889#889: upstream is back at 127.0.0.1:3000</span>'); print('<span class="green">2024/11/14 14:24:10 [notice] no new errors in the last 60s</span>'); }
    else { print('<span class="dim">... (flooding — ^C to stop)</span>'); }
    return;
  }

  // production.log
  if (lower.includes('production') && /^(tail|cat|less|more)/.test(lower)) {
    if (!killed) {
      ['<span class="red">[14:23:44] ERROR  DB connection pool exhausted (50/50 in use)</span>','<span class="red">[14:23:48] ERROR  POST /api/data — timeout after 30000ms</span>','<span class="red">[14:23:51] ERROR  POST /api/data — timeout after 30000ms</span>','<span class="dim">[14:23:55] INFO   Retrying connection... (1/3)</span>','<span class="red">[14:23:58] ERROR  All retry attempts failed</span>'].forEach(l => print(l));
    } else {
      ['<span class="yellow">[14:24:01] WARN   Worker PID 12847 terminated (SIGKILL)</span>','<span class="dim">[14:24:01] INFO   Releasing 48 stale DB connections...</span>','<span class="dim">[14:24:02] INFO   DB connection pool reset  (0/50 in use)</span>','<span class="green">[14:24:03] INFO   Health check: OK ✓  (latency: 38ms)</span>','<span class="green">[14:24:03] INFO   Application accepting requests normally</span>'].forEach(l => print(l));
    }
    return;
  }

  // curl
  if (lower.startsWith('curl')) {
    const verbose = lower.includes(' -v') || lower.includes(' -i') || lower.includes(' --include');
    const isHealth = lower.includes('health') || lower.includes('localhost') || lower.includes('127.0.0.1');
    if (isHealth) {
      if (!killed) {
        if (verbose) {
          ['<span class="dim">* Trying 127.0.0.1:3000...</span>','<span class="dim">* Connection timed out after 10001 milliseconds</span>','<span class="dim">* Closing connection 0</span>','<span class="red">curl: (28) Operation timed out after 10001 milliseconds</span>'].forEach(l => print(l));
        } else {
          print('<span class="red">curl: (7) Failed to connect to localhost port 3000: Connection refused</span>');
        }
      } else {
        if (verbose) {
          ['<span class="dim">* Trying 127.0.0.1:3000...</span>','<span class="dim">* Connected to localhost (127.0.0.1) port 3000 (#0)</span>','<span class="dim">&gt; GET /health HTTP/1.1</span>','<span class="dim">&lt; HTTP/1.1 200 OK</span>','<span class="dim">&lt; Content-Type: application/json</span>','<span class="dim">&lt; X-Response-Time: 38ms</span>',''].forEach(l => print(l));
        }
        ['{','  <span class="cyan">"status"</span>:      <span class="green">"healthy"</span>,','  <span class="cyan">"db_pool"</span>:     <span class="dim">"0/50 connections used"</span>,','  <span class="cyan">"latency_ms"</span>:  <span class="green">38</span>','}'].forEach(l => print(l));
        blank();
        print('<span class="green">✓ Production is back!</span>');
        endAdventure('free');
      }
    } else {
      print('<span class="dim">curl: (6) Could not resolve host: ' + escapeHtml(v.split(' ').pop()) + '</span>');
    }
    return;
  }

  // df -h
  if (lower === 'df -h' || lower === 'df') {
    ['<span class="dim">Filesystem      Size  Used Avail Use% Mounted on</span>','<span class="dim">/dev/sda1        50G   18G   30G  38% /</span>','<span class="dim">tmpfs           3.9G     0  3.9G   0% /dev/shm</span>','<span class="dim">/dev/sda2       100G   42G   53G  45% /var</span>'].forEach(l => print(l)); return;
  }

  // free -m
  if (lower === 'free -m' || lower === 'free -h' || lower === 'free') {
    ['<span class="dim">               total        used        free      shared  buff/cache   available</span>','<span class="dim">Mem:            7972        4821         312         142        2838        2750</span>','<span class="dim">Swap:           2047           0        2047</span>'].forEach(l => print(l)); return;
  }

  // systemctl nginx
  if (lower.includes('nginx') && lower.startsWith('systemctl')) {
    ['<span class="green">● nginx.service - A high performance web server</span>','<span class="dim">   Loaded: loaded (/lib/systemd/system/nginx.service; enabled)</span>','<span class="green">   Active: active (running) since Mon 2023-10-28 09:00:12 UTC; 47 days ago</span>','<span class="dim">   Note:   Nginx is up — the issue is upstream of nginx.</span>'].forEach(l => print(l)); return;
  }

  // systemctl app
  if (lower.startsWith('systemctl')) {
    if (!killed) {
      ['<span class="yellow">● app.service - Emily Portfolio Application</span>','<span class="dim">   Loaded: loaded (/etc/systemd/system/app.service; enabled)</span>','<span class="yellow">   Active: activating (auto-restart) since Mon 2023-11-14 14:21:30 UTC; 2min ago</span>','<span class="red">   Status: "Connection pool exhausted — worker process unresponsive"</span>'].forEach(l => print(l));
    } else {
      ['<span class="green">● app.service - Emily Portfolio Application</span>','<span class="dim">   Loaded: loaded (/etc/systemd/system/app.service; enabled)</span>','<span class="green">   Active: active (running) since Mon 2023-11-14 14:24:03 UTC</span>','<span class="dim">   Status: "Accepting requests normally"</span>'].forEach(l => print(l));
    }
    return;
  }

  // journalctl
  if (lower.startsWith('journalctl')) {
    if (!killed) {
      ['<span class="dim">-- Logs begin at Sat 2023-09-28 09:00:00 UTC --</span>','<span class="red">Nov 14 14:21:30 prod-server-01 app[1024]: ERROR: DB pool exhausted</span>','<span class="red">Nov 14 14:21:33 prod-server-01 nginx[889]: upstream timed out</span>','<span class="red">Nov 14 14:21:35 prod-server-01 nginx[889]: connect() failed</span>','<span class="dim">... (repeating every ~1 second)</span>'].forEach(l => print(l));
    } else {
      ['<span class="dim">-- Logs begin at Sat 2023-09-28 09:00:00 UTC --</span>','<span class="yellow">Nov 14 14:24:01 prod-server-01 kernel: node[12847]: killed (SIGKILL)</span>','<span class="dim">Nov 14 14:24:02 prod-server-01 app[1024]: pool reset, connections released</span>','<span class="green">Nov 14 14:24:03 prod-server-01 app[1024]: health check OK, serving requests</span>'].forEach(l => print(l));
    }
    return;
  }

  // history
  if (lower === 'history') {
    const h = commandHistory.slice(-10);
    h.forEach((c, i) => print(`<span class="dim">  ${commandHistory.length - h.length + i + 1}  ${escapeHtml(c)}</span>`)); return;
  }

  // unknown
  print(`<span class="dim">bash: ${escapeHtml(v.split(' ')[0])}: command not found</span>`);
}

function abandonAdventure() {
  adventureState = { active: false, mode: 'none', phase: 'idle', step: 0, mockCwd: '/home/emily', killed: false };
  syncAdventureInputPrompt();
  blank();
  print('<span class="dim">Incident abandoned. Type <span class="accent">adventure</span> to try again.</span>');
}

function endAdventure(mode) {
  adventureState = { active: false, mode: 'none', phase: 'idle', step: 0, mockCwd: '/home/emily', killed: false };
  syncAdventureInputPrompt();
  blank();
  print('<span class="green b">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</span>');
  print('<span class="green b">✅  INCIDENT RESOLVED — Total downtime: ~4 min</span>');
  print('<span class="green b">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</span>');
  blank();
  print('<span class="accent">Root cause:</span> Runaway worker (PID 12847) held 48 DB connections open,');
  print('exhausting the pool and timing out every request behind it.');
  blank();
  print('<span class="accent">What you used:</span>');
  print('  <span class="cyan">tail -f nginx/error.log</span>  → upstream errors → problem is app-side');
  print('  <span class="cyan">uptime</span>               → critically high load → something eating CPU');
  print('  <span class="cyan">ps aux</span>               → runaway PID 12847 at 892% CPU');
  print('  <span class="cyan">kill -9 12847</span>        → force-terminated (SIGKILL)');
  print('  <span class="cyan">tail -f production.log</span> → confirmed DB pool recovery');
  print('  <span class="cyan">curl .../health</span>      → 200 OK, production confirmed healthy');
  blank();
  if (mode === 'free') {
    print('<span class="dim">You found it yourself — that\'s real SRE instinct. 🎯</span>');
  } else {
    print('<span class="dim">You followed the incident response playbook perfectly. 📋</span>');
  }
  blank();
  print('Curious about more hidden commands? Type <span class="accent">egghunt</span> to hunt for 20+. 🥚');
  blank();
  renderChips();
}

async function boot(){
  buildReader();
  const date = new Date().toString().replace(/ GMT.*/, '');
  print(`<span class="dim">Last login: ${date} on ttys001</span>`);
  blank();
  await typeLine(' whoami', '', promptHtml('~'));
  await wait(isMobile() ? 500 : 180);
  commands.whoami();
  blank();
  await wait(isMobile() ? 600 : 0);
  await typeLine(' ./welcome.sh', '', promptHtml('~'));
  await wait(isMobile() ? 500 : 180);
  await runWelcome();
  await wait(isMobile() ? 500 : 0);

  blank();
  
  // Privacy notice for terminal view (GDPR/CCPA compliant)
  print('<span class="dim" style="font-size: 11px;">🔒 Privacy: This site uses anonymous analytics (no cookies, no personal data). Type <span class="accent">privacy</span> to learn more or opt out.</span>');
  
  inputRow.style.display = 'flex';
  fitToViewport();
  if (window.innerWidth > 600) cmdline.focus();
  
  // Restore window state from localStorage
  const savedState = localStorage.getItem('window-state');
  if (savedState && ['minimized', 'maximized'].includes(savedState)) {
    setWindowState(savedState);
    
    // If minimized, add click handler to bar
    if (savedState === 'minimized') {
      document.querySelector('.bar').addEventListener('click', restoreWindow, { once: true });
    }
  }
  
}

function armSkip(){
  const onSkip = () => { skip = true; };
  window.addEventListener('keydown', onSkip, { once:true });
  screen.addEventListener('click', onSkip, { once:true });
}

/* DevTools easter egg */
(function(){
  let devtoolsOpen = false;
  const threshold = 160;
  function onDevToolsOpen(){
    if (devtoolsOpen) return;
    devtoolsOpen = true;
    if (typeof huntState !== 'undefined' && huntState.active) {
      console.log('%cTrying to cheat? 🙈\n%cWhere\'s the fun in that... but I respect that you try.\n\nThe eggs are in the terminal. Go find them the honest way!', 'color:#e6b450;font-size:22px;font-weight:bold;', 'color:#7ec699;font-size:14px;');
    } else {
      console.log('%cHello World! 👋\n%cI see you\'re peeking into my code.\n\nIf you\'re a developer, I\'d love to chat!\nhttps://linkedin.com/in/memilyc', 'color:#7ec699;font-size:24px;font-weight:bold;', 'color:#e6b450;font-size:14px;');
    }
  }
  function checkSize(){ if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) onDevToolsOpen(); }
  setInterval(checkSize, 1000);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') setTimeout(onDevToolsOpen, 500); if (e.key === 'F12') setTimeout(onDevToolsOpen, 500); });
  
  // Window control keyboard shortcuts
  document.addEventListener('keydown', e => {
    // Esc = toggle close/restore (only when not typing)
    if (e.key === 'Escape' && !cmdline.matches(':focus')) {
      e.preventDefault();
      e.stopPropagation();
      if (windowState === 'normal') {
        setWindowState('closed');
        document.body.style.cursor = 'pointer';
        document.body.title = 'Click anywhere to restore terminal';
        armRestore(document.body);
      } else {
        restoreWindow();
      }
    }
    
    // Cmd/Ctrl + M = minimize
    if ((e.metaKey || e.ctrlKey) && e.key === 'm' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (windowState === 'minimized') {
        restoreWindow();
      } else {
        setWindowState('minimized');
        armRestore(document.querySelector('.bar'));
      }
    }
    
    // Cmd/Ctrl + F = fullscreen/maximize
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      e.preventDefault();
      e.stopPropagation();
      setWindowState(windowState === 'maximized' ? 'normal' : 'maximized');
    }
  });
  document.addEventListener('contextmenu', () => { setTimeout(() => { if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) onDevToolsOpen(); }, 800); });
})();

armSkip();
boot();

/* Track page view */
trackPageView();

/* Scroll to section if URL has hash */
if (window.location.hash && root.getAttribute('data-view') === 'reader') {
  setTimeout(() => {
    const el = document.querySelector(window.location.hash);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
