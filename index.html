<!DOCTYPE html>
<html lang="en" data-theme="dark" data-view="terminal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>M. Emily Chang | Technical Support Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* =========================================================
     EDIT ME: Theme palettes. Two terminal color schemes.
     ========================================================= */
  :root[data-theme="dark"] {
    --bg:        #0b0e14;
    --bg-window: #0e1219;
    --bg-bar:    #161b25;
    --fg:        #c4cbd8;
    --dim:       #5b6675;
    --prompt:    #58d68d;  /* the $ and user@host */
    --path:      #5fb8e0;
    --accent:    #7ee787;
    --cyan:      #56d4dd;
    --yellow:    #e7c664;
    --red:       #ff6b6b;
    --magenta:   #c792ea;
    --border:    #1d2530;
    --glow:      rgba(126,231,135,0.10);
    --scan:      rgba(255,255,255,0.022);
    --selection: rgba(126,231,135,0.25);
  }
  :root[data-theme="light"] {
    --bg:        #e8e3d6;
    --bg-window: #f6f2e7;
    --bg-bar:    #e3dcc9;
    --fg:        #43403a;
    --dim:       #a39c88;
    --prompt:    #2e8b57;
    --path:      #1c7a9a;
    --accent:    #408a3d;
    --cyan:      #1c8a9a;
    --yellow:    #b07d00;
    --red:       #c4314b;
    --magenta:   #8959a8;
    --border:    #d4ccb8;
    --glow:      rgba(64,138,61,0.08);
    --scan:      rgba(0,0,0,0.02);
    --selection: rgba(64,138,61,0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--selection); }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color: var(--fg);
    transition: background 0.35s ease, color 0.35s ease;
  }

  /* atmospheric background grid behind the window */
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 40px);
    background-image:
      radial-gradient(circle at 50% 0%, var(--glow), transparent 60%),
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 100% 100%, 44px 44px, 44px 44px;
    background-position: center;
  }

  .window {
    width: min(860px, 100%);
    height: min(78vh, 720px);
    display: flex;
    flex-direction: column;
    background: var(--bg-window);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.55), 0 0 0 1px var(--border);
    position: relative;
    animation: bootIn 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes bootIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  /* title bar with traffic-light dots */
  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: var(--bg-bar);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .bar .title {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: 0.3px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: inherit;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .bar-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* scanline + grain overlay for CRT feel */
  .window::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, var(--scan) 0px, var(--scan) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    opacity: 0.7;
  }

  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 22px 8px;
    font-size: 14px;
    line-height: 1.65;
  }
  .screen::-webkit-scrollbar { width: 9px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }
  .screen::-webkit-scrollbar-track { background: transparent; }

  .line { white-space: pre-wrap; word-break: break-word; }
  .line + .line { margin-top: 1px; }

  .prompt { color: var(--prompt); }
  .path   { color: var(--path); }
  .cmd    { color: var(--fg); }
  .dim    { color: var(--dim); }
  .accent { color: var(--accent); }
  .cyan   { color: var(--cyan); }
  .yellow { color: var(--yellow); }
  .red    { color: var(--red); }
  .magenta{ color: var(--magenta); }
  .b      { font-weight: 700; }

  a.tlink { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted var(--cyan); }
  a.tlink:hover { color: var(--accent); border-color: var(--accent); }

  pre.ascii {
    color: var(--accent);
    font-size: 12px;
    line-height: 1.2;
    white-space: pre;
    overflow-x: auto;
  }

  /* clickable command chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 12.5px;
    padding: 4px 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }

  /* input row */
  .input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--border);
  }
  .input-row .ps { color: var(--prompt); white-space: nowrap; }
  .input-row .ps .path { color: var(--path); }
  .input-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .ghost {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    white-space: pre;
    pointer-events: none;
    color: var(--dim);
    font-family: inherit;
    font-size: 14px;
    overflow: hidden;
  }
  .ghost .gt { color: transparent; }   /* typed portion: invisible, just reserves width */
  .hint {
    flex: 0 0 auto;
    color: var(--dim);
    font-size: 12px;
    white-space: nowrap;
    padding-left: 10px;
    opacity: 0.85;
  }
  #cmdline {
    position: relative;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    caret-color: var(--accent);
  }

  .credit {
    flex: 0 0 auto;
    padding: 7px 22px;
    font-size: 11px;
    color: var(--dim);
    background: var(--bg-bar);
    border-top: 1px solid var(--border);
    letter-spacing: 0.3px;
    user-select: none;
    text-align: center;
  }

  /* =========================================================
     Reader view — same content (from CONFIG), plain layout
     ========================================================= */
  .reader {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 40px clamp(22px, 6vw, 56px) 30px;
  }
  .reader::-webkit-scrollbar { width: 9px; }
  .reader::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }
  .reader::-webkit-scrollbar-track { background: transparent; }

  /* show exactly one view */
  [data-view="terminal"] .reader { display: none; }
  [data-view="reader"] .screen,
  [data-view="reader"] .input-row { display: none !important; }

  .r-name {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--fg);
    line-height: 1.1;
  }
  .r-role { margin-top: 8px; font-size: 15px; color: var(--accent); font-weight: 500; }
  .r-tag  { margin-top: 12px; font-size: 15px; color: var(--dim); max-width: 60ch; line-height: 1.6; }
  .r-sec  { margin-top: 32px; }
  .r-h {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .r-body { font-size: 15px; line-height: 1.8; color: var(--fg); max-width: 66ch; }
  .r-skills, .r-links { list-style: none; }
  .r-skills li {
    display: flex; gap: 14px; padding: 8px 0; flex-wrap: wrap;
    border-bottom: 1px dashed var(--border);
  }
  .r-skills li:last-child { border-bottom: none; }
  .r-k { color: var(--yellow); font-weight: 700; flex: 0 0 150px; }
  .r-v { color: var(--fg); }
  .r-links li { display: flex; gap: 14px; padding: 8px 0; flex-wrap: wrap; align-items: baseline; }
  .r-lk { color: var(--magenta); font-weight: 700; flex: 0 0 90px; }
  .r-sub { font-size: 13px; color: var(--dim); margin: -8px 0 14px; }
  .r-strengths { list-style: none; counter-reset: s; }
  .r-strengths li {
    counter-increment: s;
    display: flex; gap: 12px; padding: 8px 0; flex-wrap: wrap; align-items: baseline;
    border-bottom: 1px dashed var(--border);
  }
  .r-strengths li:last-child { border-bottom: none; }
  .r-strengths li::before {
    content: counter(s) ".";
    color: var(--cyan); font-weight: 700; flex: 0 0 auto; min-width: 16px;
  }
  .r-st { color: var(--yellow); font-weight: 700; flex: 0 0 150px; }
  .r-sd { color: var(--fg); flex: 1; min-width: 220px; }
  .r-cv {
    display: inline-block;
    margin-top: 4px;
    padding: 12px 24px;
    background: var(--accent);
    color: var(--bg-window);
    font-weight: 700;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .r-cv:hover { opacity: 0.9; transform: translateY(-1px); }

  /* projects in reader view */
  .r-projects { list-style: none; }
  .r-projects li {
    padding: 12px 0;
    border-bottom: 1px dashed var(--border);
  }
  .r-projects li:last-child { border-bottom: none; }
  .r-proj-title { color: var(--cyan); font-weight: 700; font-size: 15px; }
  .r-proj-stack { font-size: 12px; color: var(--magenta); margin: 3px 0 6px; }
  .r-proj-desc { font-size: 14px; color: var(--fg); line-height: 1.7; max-width: 62ch; }
  .r-proj-link { font-size: 13px; margin-top: 6px; }

  @media (max-width: 600px) {
    .reader { padding: 26px 18px 22px; }
    .r-name { font-size: 30px; }
    .r-k, .r-st { flex-basis: 110px; }
    .r-cv { display: block; text-align: center; }
  }

  /* blinking block cursor used during boot typing */
  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .fade-in { animation: fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

  @media (max-width: 600px) {
    /* full-screen, app-like: no floating card, use every pixel */
    html, body { height: 100dvh; overflow: hidden; }
    body {
      padding: 0;
      align-items: stretch;
      justify-content: flex-start;
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }
    .window {
      width: 100%;
      height: 100dvh;            /* JS overrides this with the visual-viewport height when the keyboard opens */
      max-height: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
    }
    .bar { padding: 12px 14px; }
    .bar .title { font-size: 11px; }
    /* larger, thumb-friendly tap targets */
    .bar-btn { font-size: 12px; padding: 7px 11px; }
    .screen { font-size: 13.5px; padding: 16px 15px 6px; }
    .chips { gap: 9px; }
    .chip { font-size: 13.5px; padding: 8px 14px; }
    .input-row { padding: 12px 15px calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
    /* 16px input prevents iOS Safari from auto-zooming on focus */
    #cmdline, .ghost { font-size: 16px; }
    .ps { font-size: 14px; }
    .hint { display: none; }     /* free up width on small screens */
    .credit { padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); }
    pre.ascii { font-size: 9px; }
  }
  .neofetch-container {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 10px;
}
.neofetch-avatar {
    width: 100px; /* Adjust size to your preference */
    height: auto;
    image-rendering: pixelated; /* Keeps pixels sharp */
    border: 1px solid var(--border);
    padding: 4px;
    background: var(--bg-bar);
}
@media (max-width: 600px) {
  header {
    flex-direction: column-reverse; /* Puts image above text on mobile */
    align-items: flex-start !important;
    gap: 15px !important;
  }
}
</style>
</head>
<body>

<script>

/* helper: call an edge function */
async function edgeFn(name, opts = {}) {
  const url = `${CONFIG.supabase.url}/functions/v1/${name}`;
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.supabase.anonKey}` };
  const res = await fetch(url, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  return res.json();
}

/* ---- theme (persists when deployed; degrades safely in preview) ---- */

/* ---- reader view: renders the SAME CONFIG as a plain page ---- */

  reader.innerHTML = `

/* ---- output helpers ---- */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function print(html, cls){
  const d = el('div', 'line fade-in' + (cls ? ' ' + cls : ''), html);
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
  return d;
}
function printPromptEcho(cmd){
  print(`<span class="prompt">${CONFIG.user}@${CONFIG.host}</span>:<span class="path">~</span>$ <span class="cmd">${escapeHtml(cmd)}</span>`);
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function blank(){ print('&nbsp;'); }

  async _startQuiz(sub){
    let category   = null;
    let difficulty = null;
    let label      = 'Mixed';

    if (sub === 'emily') {
      category = 'emily';
      label    = 'Emily (exclusive)';
    } else if (sub === 'easy' || sub === 'medium' || sub === 'hard') {
      difficulty = sub;
      label      = sub.charAt(0).toUpperCase() + sub.slice(1);
    } else if (sub === 'mixed' || sub === '4') {
      label = 'Mixed';
    } else if (sub === '1') { difficulty = 'easy';   label = 'Easy'; }
      else if (sub === '2') { difficulty = 'medium'; label = 'Medium'; }
      else if (sub === '3') { difficulty = 'hard';   label = 'Hard'; }
      else if (sub === '5') { category = 'emily';    label = 'Emily (exclusive)'; }
    else if (sub && sub !== '') {
      category = sub;
      label    = sub.charAt(0).toUpperCase() + sub.slice(1);
    }

    print(`<span class="dim">$ starting trivia quiz${difficulty ? ' [' + difficulty + ']' : ''}${category ? ' [' + category + ']' : ''}...</span>`);
    print('<span class="dim">Fetching questions from database...</span>');

    try {
      let url = 'start-quiz';
      const params = [];
      if (category)   params.push(`category=${encodeURIComponent(category)}`);
      if (difficulty)  params.push(`difficulty=${encodeURIComponent(difficulty)}`);
      if (params.length) url += '?' + params.join('&');

      const data = await edgeFn(url, { method: 'POST' });
      if (data.error) { print(`<span class="red">Error: ${escapeHtml(data.error)}</span>`); return; }

      quizState.active = true;
      quizState.phase = 'playing';
      quizState.sessionId = data.sessionId;
      quizState.questions = data.questions;
      quizState.currentQ = 0;
      quizState.answers = [];
      quizState.startTime = Date.now();
      quizState.quizCategory = data.category || category || 'mixed';
      quizState.quizDifficulty = data.difficulty || difficulty || 'mixed';

      blank();
      print(`<span class="accent b">Trivia Quiz</span> <span class="dim">— ${data.questions.length} questions | ${label}</span>`);
      print('<span class="dim">Type a, b, c, or d to answer. Type quit to abandon.</span>');
      blank();
      showQuizQuestion();
    } catch(e) {
      print(`<span class="red">Failed to start quiz: ${escapeHtml(e.message)}</span>`);
    }
  },

  async leaderboard(args){

    const filter = (args || '').trim().toLowerCase();
    let diffFilter  = null;

    if (filter === 'easy' || filter === 'medium' || filter === 'hard') {
      diffFilter = filter;
      label      = filter.charAt(0).toUpperCase() + filter.slice(1);

      catFilter = filter;
      label     = filter.charAt(0).toUpperCase() + filter.slice(1);

    print(`<span class="dim">$ cat leaderboard.txt${filter ? ' | filter: ' + filter : ''}</span>`);

        .from('leaderboard')
        .select('nickname, score, total_questions, duration_seconds, category, difficulty, created_at')
        .order('score', { ascending: false })
        .order('duration_seconds', { ascending: true });

      if (diffFilter) query = query.eq('difficulty', diffFilter);
      if (catFilter)  query = query.eq('category', catFilter);

/* =========================================================

   ========================================================= */
function showQuizQuestion(){
  const q = quizState.questions[quizState.currentQ];
  if (!q) return;
  const num = quizState.currentQ + 1;
  const total = quizState.questions.length;
  blank();
  print(`<span class="cyan b">Question ${num}/${total}</span> <span class="dim">[${q.category || 'mixed'} | ${q.difficulty || 'medium'}]</span>`);
  print(escapeHtml(q.question));
  blank();
  print(`  <span class="yellow b">a)</span> ${escapeHtml(q.option_a)}`);
  print(`  <span class="yellow b">b)</span> ${escapeHtml(q.option_b)}`);
  print(`  <span class="yellow b">c)</span> ${escapeHtml(q.option_c)}`);
  print(`  <span class="yellow b">d)</span> ${escapeHtml(q.option_d)}`);
  blank();
  print('<span class="dim">Your answer (a/b/c/d):</span>');
}

async function submitQuizAnswer(answer){
  const q = quizState.questions[quizState.currentQ];
  quizState.answers.push(answer);
  const correct = answer === 'a' || answer === 'b' || answer === 'c' || answer === 'd';
  if (correct) {
    print(`  <span class="accent">You chose: ${answer})</span>`);
  }
  quizState.currentQ++;

  if (quizState.currentQ >= quizState.questions.length) {
    // Quiz done — ask for nickname
    quizState.phase = 'nickname';
    blank();
    print('<span class="accent b">Quiz complete!</span>');
    print(`<span class="dim">Time: ${Math.round((Date.now() - quizState.startTime) / 1000)}s</span>`);
    blank();
    print('Enter your nickname for the leaderboard (3–20 chars):');
  } else {
    showQuizQuestion();
  }
}

  try {

      body: JSON.stringify({
        sessionId: quizState.sessionId,
        answers: quizState.answers,
        nickname: nickname,
        duration: duration,
      }),
    });

    if (data.error) {
      print(`<span class="red">Error: ${escapeHtml(data.error)}</span>`);
      resetQuizState();
      return;
    }

    blank();
    print('<span class="accent b">═══════════════════════════════════</span>');
    print(`<span class="accent b">  Score: ${data.score}/${data.total}</span>`);
    const pct = Math.round((data.score / data.total) * 100);
    const emoji = pct >= 80 ? '\uD83C\uDF89' : pct >= 50 ? '\uD83D\uDC4D' : '\uD83D\uDE22';
    print(`  ${emoji}  ${pct}%`);
    print('<span class="accent b">═══════════════════════════════════</span>');
    blank();
    print('<span class="dim">Type <span class="accent">leaderboard</span> to see the rankings!</span>');
  } catch(e) {
    print(`<span class="red">Failed to submit: ${escapeHtml(e.message)}</span>`);
  }
  resetQuizState();
}

async function submitGuestbook(){
  print('<span class="dim">Submitting...</span>');

  try {
    const data = await edgeFn('post-guestbook', {

  }

  quizState.gbStep = 'idle';
  quizState.gbNickname = '';
  quizState.gbMessage = '';
}

/* =========================================================
   Autocomplete + fuzzy matching
   ========================================================= */
const COMMANDS = Object.keys(commands);
const ghost = document.getElementById('ghost');
const hint  = document.getElementById('hint');

/* subsequence fuzzy score; -1 means the query isn't even a subsequence */
function fuzzyScore(query, target){
  query = query.toLowerCase(); target = target.toLowerCase();
  if (!query) return 0;
  let qi = 0, score = 0, prev = -2;
  for (let ti = 0; ti < target.length && qi < query.length; ti++){
    if (target[ti] === query[qi]){
      score += 1;
      if (ti === 0) score += 6;          // matches first char
      if (ti === prev + 1) score += 4;   // consecutive run
      prev = ti;
      qi++;
    }
  }
  if (qi < query.length) return -1;       // leftover query chars => no match
  score -= (target.length - query.length) * 0.15; // prefer tighter matches
  return score;
}

/* ranked matches: prefix matches first, then by score */
function getMatches(input){
  const q = (input || '').trim().toLowerCase();
  if (!q) return [];
  return COMMANDS
    .map(name => ({ name, score: fuzzyScore(q, name), prefix: name.startsWith(q) }))
    .filter(m => m.score >= 0)
    .sort((a, b) => (b.prefix - a.prefix) || (b.score - a.score) || (a.name.length - b.name.length));
}

/* inline ghost suffix for prefix matches; right-side hint for fuzzy typos */
function updateGhost(){
  const v = cmdline.value;
  const m = getMatches(v);
  ghost.innerHTML = '';
  hint.innerHTML = '';
  if (!v.trim() || !m.length) return;
  const best = m[0];
  if (best.prefix && best.name !== v.trim().toLowerCase()){
    ghost.innerHTML = `<span class="gt">${escapeHtml(v)}</span>${escapeHtml(best.name.slice(v.length))}`;
    hint.innerHTML = '<span class="dim">↹ tab</span>';
  } else if (!best.prefix){
    hint.innerHTML = `<span class="dim">↹ ${escapeHtml(best.name)}?</span>`;
  }
}

/* tab cycles through all candidates (prefix-first) */
let tab = { active: false, list: [], idx: -1 };
function onTab(){
  if (!tab.active){
    const m = getMatches(cmdline.value);
    if (!m.length) return;
    tab = { active: true, list: m.map(x => x.name), idx: -1 };
  }
  tab.idx = (tab.idx + 1) % tab.list.length;
  cmdline.value = tab.list[tab.idx];
  updateGhost();
}

/* resolve a typed command to a real one (exact, else easter egg, else first-word, else best fuzzy) */
function resolve(raw){
  const v = (raw || '').trim().toLowerCase();
  if (!v) return null;

  // 1. Check easter egg multi-word commands first (longest match)
  const easterKeys = Object.keys(EASTER_EGGS).sort((a,b) => b.length - a.length);
  for (const ek of easterKeys) {
    if (v === ek || v.startsWith(ek + ' ')) {
      return { name: EASTER_EGGS[ek], corrected: false, easter: true };
    }
  }

  // 2. Exact match in commands object
  if (commands[v]) return { name: v, corrected: false };

  // 3. First-word match (e.g. "guestbook sign" → command "guestbook" with args)
  const firstWord = v.split(/\s+/)[0];
  if (firstWord !== v && commands[firstWord]) {
    return { name: firstWord, corrected: false, hasArgs: true };
  }

  // 4. Fuzzy match
  const m = getMatches(v);
  return m.length ? { name: m[0].name, corrected: true } : null;
}

function runCommand(raw){
  const cmd = (raw || '').trim();
  printPromptEcho(cmd);
  if (!cmd) return;

  // Stop tail -f animation if running
  if (quizState.tailInterval) {
    clearInterval(quizState.tailInterval);
    quizState.tailInterval = null;
  }

  const r = resolve(cmd);
  if (r){
    if (r.corrected) print(`<span class="dim">≈ assuming <span class="accent">${escapeHtml(r.name)}</span></span>`);
    const cmdName = r.name;
    const cmdFn = commands[cmdName];
    if (cmdFn) {
      // Extract args after the first word for commands like "guestbook sign"
      const args = cmd.toLowerCase().replace(new RegExp('^' + cmdName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*'), '');
      cmdFn(args || undefined);
    }
  } else {
    print(`<span class="red">command not found: ${escapeHtml(cmd)}</span> — type <span class="accent">help</span>`, '');
  }
  blank();
}

/* ---- command input: history + enter ---- */
const history = []; let hi = -1;
cmdline.addEventListener('input', () => { tab.active = false; updateGhost(); });
cmdline.addEventListener('keydown', e => {
  if (e.key === 'Tab'){
    e.preventDefault();
    onTab();
    return;
  }
  // Right arrow at end of line accepts the inline ghost suggestion
  if (e.key === 'ArrowRight' && cmdline.selectionStart === cmdline.value.length){
    const m = getMatches(cmdline.value);
    if (m.length && m[0].prefix && m[0].name !== cmdline.value.trim().toLowerCase()){
      e.preventDefault();
      cmdline.value = m[0].name;
      tab.active = false;
      updateGhost();
      return;
    }
  }
  if (e.key === 'Enter'){
    const v = cmdline.value;
    cmdline.value = '';
    tab.active = false;
    updateGhost();

    // ─── Resume prompt: Y/n ───
    if (quizState.resumePrompt) {
      const ans = v.trim().toLowerCase();
      printPromptEcho(ans);
      quizState.resumePrompt = false;
      if (ans === '' || ans === 'y' || ans === 'yes') {
        print('<span class="accent b">Opening resume...</span>');
        window.open('https://memilyc.github.io', '_blank', 'noopener');
      } else {
        print('<span class="dim">Cancelled.</span>');
      }
      return;
    }

    // ─── Quiz: picking phase (mode selection) ───
    if (quizState.phase === 'picking') {
      const pick = v.trim().toLowerCase();
      printPromptEcho(pick);
      if (['1','2','3','4','5','easy','medium','hard','mixed','emily'].includes(pick)) {
        quizState.phase = 'idle';
        commands._startQuiz(pick);
      } else if (pick === 'quit' || pick === 'cancel') {
        quizState.phase = 'idle';
        print('<span class="dim">Cancelled.</span>');
      } else {
        print('<span class="yellow">Pick 1–5, or type easy / medium / hard / mixed / emily</span>');
      }
      return;
    }

    // ─── Quiz: playing phase ───
    if (quizState.phase === 'playing') {
      const ans = v.trim().toLowerCase();
      if (ans === 'quit') {
        printPromptEcho('quit');
        print('<span class="yellow">Quiz abandoned.</span>');
        resetQuizState();
        blank();
      } else if (['a','b','c','d'].includes(ans)) {
        printPromptEcho(ans);
        submitQuizAnswer(ans);
      } else {
        printPromptEcho(v);
        print('<span class="yellow">Type a, b, c, or d to answer. Type quit to abandon.</span>');
      }
      return;
    }

    // ─── Quiz: nickname phase ───
    if (quizState.phase === 'nickname') {
      const nick = v.trim();
      printPromptEcho(nick);
      if (!nick || nick.length < 3 || nick.length > 20 || !/^[a-zA-Z0-9 _-]+$/.test(nick)) {
        print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>');
        return;
      }
      if (!isClean(nick)) {
        print('<span class="yellow">That nickname isn\'t allowed. Please choose something appropriate.</span>');
        return;
      }
      finishQuiz(nick);
      return;
    }

    // ─── Guestbook: signing flow ───
    if (quizState.gbStep === 'nickname') {
      const nick = v.trim();
      printPromptEcho(nick);
      if (!nick || nick.length < 3 || nick.length > 20 || !/^[a-zA-Z0-9 _-]+$/.test(nick)) {
        print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>');
        return;
      }
      if (!isClean(nick)) {
        print('<span class="yellow">That nickname isn\'t allowed. Please choose something appropriate.</span>');
        return;
      }
      quizState.gbNickname = nick;
      quizState.gbStep = 'message';
      print('Enter your message (2–300 chars):');
      return;
    }
    if (quizState.gbStep === 'message') {
      const msg = v.trim();
      printPromptEcho(msg);
      if (!msg || msg.length < 2) {
        print('<span class="yellow">Message too short (min 2 chars).</span>');
        return;
      }
      if (msg.length > 300) {
        print('<span class="yellow">Message too long (max 300 chars).</span>');
        return;
      }
      if (!isClean(msg)) {
        print('<span class="yellow">That message isn\'t allowed. Please keep it appropriate.</span>');
        return;
      }
      quizState.gbMessage = msg;
      submitGuestbook();
      return;
    }

    // ─── Normal command ───
    if (v.trim()) { history.push(v); hi = history.length; }
    runCommand(v);
  } else if (e.key === 'ArrowUp'){
    if (hi > 0){ hi--; cmdline.value = history[hi]; tab.active = false; updateGhost(); e.preventDefault(); }
  } else if (e.key === 'ArrowDown'){
    if (hi < history.length-1){ hi++; cmdline.value = history[hi]; }
    else { hi = history.length; cmdline.value = ''; }
    tab.active = false; updateGhost();
  }
});
const win = document.getElementById('window');
win.addEventListener('click', e => {
  if (root.getAttribute('data-view') !== 'terminal') return;
  if (e.target.closest('a, button, input')) return;
  cmdline.focus();
});

/* =========================================================
   Mobile keyboard handling — keep the input above the keyboard.
   On phones the visual viewport shrinks when the keyboard opens
   (vh/dvh do not on iOS), so we size the window to it directly.
   ========================================================= */
const vv = window.visualViewport;
function fitToViewport(){
  if (!vv) return;
  if (window.innerWidth <= 600){
    win.style.height = vv.height + 'px';
  } else {
    win.style.height = '';   // desktop: let CSS own the height
  }
  if (root.getAttribute('data-view') === 'terminal') screen.scrollTop = screen.scrollHeight;
}
if (vv){
  vv.addEventListener('resize', fitToViewport);
  vv.addEventListener('scroll', fitToViewport);
}
window.addEventListener('resize', fitToViewport);
window.addEventListener('orientationchange', () => setTimeout(fitToViewport, 200));
fitToViewport();

/* when the input gains focus, make sure the latest output is in view */
cmdline.addEventListener('focus', () => {
  setTimeout(() => { fitToViewport(); screen.scrollTop = screen.scrollHeight; }, 250);
});

/* =========================================================
   Boot sequence — typewriter intro, then auto-run a couple
   of commands so content shows without any typing required.
   ========================================================= */
let skip = false;
function typeLine(text, cls){
  return new Promise(res => {
    const node = print('', cls);
    const cursor = el('span','cursor');
    node.appendChild(cursor);
    let i = 0;
    const speed = 16;
    (function step(){
      if (skip){ node.innerHTML = text; res(); return; }
      if (i <= text.length){
        node.innerHTML = text.slice(0,i);
        node.appendChild(cursor);
        screen.scrollTop = screen.scrollHeight;
        i++;
        setTimeout(step, speed);
      } else {
        node.innerHTML = text;
        res();
      }
    })();
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, skip ? 0 : ms)); }

async function boot(){
  // buildReader needs escapeHtml, which is defined above — safe to call here
  buildReader();
  const date = new Date().toString().replace(/ GMT.*/, '');
  print(`<span class="dim">Last login: ${date} on ttys001</span>`);
  blank();
  await typeLine(`${CONFIG.user}@${CONFIG.host}:~$ whoami`, '');
  await wait(180);
  commands.whoami();
  blank();
  await typeLine(`${CONFIG.user}@${CONFIG.host}:~$ ./welcome.sh`, '');
  await wait(180);
  commands.about();
  blank();
  print('<span class="dim">Tip: type a command (<span class="accent">Tab</span> to autocomplete, <span class="accent">→</span> to accept), or just click below ↓</span>');
  print('<span class="dim">New to terminals? Click <span class="accent">▤ reader view</span> (top-right) for a plain page.</span>');
  commands.help();
  blank();
  // reveal the live prompt
  inputRow.style.display = 'flex';
  fitToViewport();
  if (window.innerWidth > 600) cmdline.focus();  // avoid popping the keyboard on phones
}

/* let the visitor skip the typing animation */
function armSkip(){
  const onSkip = () => { skip = true; };
  window.addEventListener('keydown', onSkip, { once:true });
  screen.addEventListener('click', onSkip, { once:true });
}

/* ---- DevTools / Inspect Element easter egg ---- */
(function(){
  let devtoolsOpen = false;
  const threshold = 160;

  function onDevToolsOpen(){
    if (devtoolsOpen) return;
    devtoolsOpen = true;
    blank();
    print('<span class="green b">Hello World!</span>');
    print('<span class="dim">I see you\u2019re peeking into my code. \u{1F575}\uFE0F</span>');
    blank();
    console.log(
      '%cHello World! \u{1F44B}\n%cI see you\'re peeking into my code.\n\nIf you\'re a developer, I\'d love to chat!\nhttps://linkedin.com/in/memilyc',
      'color:#7ec699;font-size:24px;font-weight:bold;',
      'color:#e6b450;font-size:14px;'
    );
  }

  // Method 1: Window size discrepancy (detects docked DevTools)
  function checkSize(){
    const widthDiff = window.outerWidth - window.innerWidth;
    const heightDiff = window.outerHeight - window.innerHeight;
    if (widthDiff > threshold || heightDiff > threshold) onDevToolsOpen();
  }

  // Poll size check (non-intrusive, works for docked DevTools)
  setInterval(checkSize, 1000);

  // Keyboard shortcuts: Ctrl+Shift+I / Cmd+Opt+I / F12
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') {
      setTimeout(onDevToolsOpen, 500);
    }
    if (e.key === 'F12') {
      setTimeout(onDevToolsOpen, 500);
    }
  });

  // Also listen for right-click -> Inspect
  document.addEventListener('contextmenu', () => {
    setTimeout(() => {
      if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
        onDevToolsOpen();
      }
    }, 800);
  });
})();
armSkip();
boot();
