<style>
  :root[data-theme="dark"] {
    --bg:        #0b0e14;
    --bg-window: #0e1219;
    --bg-bar:    #161b25;
    --fg:        #c4cbd8;
    --dim:       #5b6675;
    --prompt:    #58d68d;
    --path:      #5fb8e0;
    --accent:    #7ee787;
    --cyan:      #56d4dd;
    --yellow:    #e7c664;
    --red:       #ff6b6b;
    --magenta:   #c792ea;
    --border:    #1d2530;
    --glow:      rgba(126,231,135,0.10);
    --scan:      rgba(255,255,255,0.022);
    --selection: rgba(126,231,135,0.25);
  }
  :root[data-theme="light"] {
    --bg:        #e8e3d6;
    --bg-window: #f6f2e7;
    --bg-bar:    #e3dcc9;
    --fg:        #43403a;
    --dim:       #a39c88;
    --prompt:    #2e8b57;
    --path:      #1c7a9a;
    --accent:    #408a3d;
    --cyan:      #1c8a9a;
    --yellow:    #b07d00;
    --red:       #c4314b;
    --magenta:   #8959a8;
    --border:    #d4ccb8;
    --glow:      rgba(64,138,61,0.08);
    --scan:      rgba(0,0,0,0.02);
    --selection: rgba(64,138,61,0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--selection); }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color: var(--fg);
    transition: background 0.35s ease, color 0.35s ease;
  }

  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 40px);
    background-image:
      radial-gradient(circle at 50% 0%, var(--glow), transparent 60%),
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 100% 100%, 44px 44px, 44px 44px;
    background-position: center;
  }

  .window {
    width: min(860px, 100%);
    height: min(78vh, 720px);
    display: flex;
    flex-direction: column;
    background: var(--bg-window);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.55), 0 0 0 1px var(--border);
    position: relative;
    animation: bootIn 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes bootIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: var(--bg-bar);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .bar .title {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: 0.3px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: inherit;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .bar-btn:hover { color: var(--accent); border-color: var(--accent); }

  .window::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, var(--scan) 0px, var(--scan) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    opacity: 0.7;
  }

  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 22px 8px;
    font-size: 14px;
    line-height: 1.65;
  }
  .screen::-webkit-scrollbar { width: 9px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }
  .screen::-webkit-scrollbar-track { background: transparent; }

  .line { white-space: pre-wrap; word-break: break-word; }
  .line + .line { margin-top: 1px; }

  .prompt { color: var(--prompt); }
  .path   { color: var(--path); }
  .cmd    { color: var(--fg); }
  .dim    { color: var(--dim); }
  .accent { color: var(--accent); }
  .cyan   { color: var(--cyan); }
  .yellow { color: var(--yellow); }
  .red    { color: var(--red); }
  .magenta{ color: var(--magenta); }
  .b      { font-weight: 700; }

  a.tlink { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted var(--cyan); }
  a.tlink:hover { color: var(--accent); border-color: var(--accent); }

  pre.ascii {
    color: var(--accent);
    font-size: 12px;
    line-height: 1.2;
    white-space: pre;
    overflow-x: auto;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 12.5px;
    padding: 4px 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }

  .input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--border);
  }
  .input-row .ps { color: var(--prompt); white-space: nowrap; }
  .input-row .ps .path { color: var(--path); }
  .input-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .ghost {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    white-space: pre;
    pointer-events: none;
    color: var(--dim);
    font-family: inherit;
    font-size: 14px;
    overflow: hidden;
  }
  .ghost .gt { color: transparent; }
  .hint {
    flex: 0 0 auto;
    color: var(--dim);
    font-size: 12px;
    white-space: nowrap;
    padding-left: 10px;
    opacity: 0.85;
  }
  #cmdline {
    position: relative;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    caret-color: var(--accent);
  }

  .credit {
    flex: 0 0 auto;
    padding: 7px 22px;
    font-size: 11px;
    color: var(--dim);
    background: var(--bg-bar);
    border-top: 1px solid var(--border);
    letter-spacing: 0.3px;
    user-select: none;
    text-align: center;
  }

  /* =========================================================
     Reader view
     ========================================================= */
  .reader {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 40px clamp(22px, 6vw, 56px) 30px;
  }
  .reader::-webkit-scrollbar { width: 9px; }
  .reader::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }
  .reader::-webkit-scrollbar-track { background: transparent; }

  [data-view="terminal"] .reader { display: none; }
  [data-view="reader"] .screen,
  [data-view="reader"] .input-row { display: none !important; }

  /* ── Window State Behaviors ─────────────────────────────── */
  .window {
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                margin 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 🔴 CLOSED: Hide terminal completely */
  .window.closed {
    transform: scale(0.9);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  /* 🟡 MINIMIZED: Show only title bar (collapse screen + input) */
  .window.minimized .screen,
  .window.minimized .input-row,
  .window.minimized .credit,
  .window.minimized .reader {
    display: none !important;
  }

  .window.minimized {
    height: 43px !important;
    min-height: 43px !important;
    max-height: 43px !important;
    overflow: hidden;
  }

  .window.minimized .bar {
    cursor: pointer; /* click to restore */
  }

  /* 🟢 MAXIMIZED: Fill entire viewport */
  .window.maximized {
    width: 100vw !important;
    height: 100vh !important;
    min-width: 100vw !important;
    min-height: 100vh !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    border-radius: 0;
    margin: 0 !important;
  }

  /* Mobile: maximized is default anyway */
  @media (max-width: 768px) {
    .window.maximized {
      width: 100%;
      height: 100%;
    }
  }

  /* Hover effects for dots (macOS style) */
  .dot {
    cursor: pointer;
    transition: filter 0.15s ease;
    position: relative;
  }
  .dot:hover {
    filter: brightness(1.2);
  }
  .dot:active {
    filter: brightness(0.9);
  }

  /* Show icons on hover (macOS style) */
  .dot::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 9px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }

  .dot.r::after { content: '✕'; color: #4a0002; }
  .dot.y::after { content: '−'; color: #995700; }
  .dot.g::after { content: '+'; color: #006500; }

  .dot:hover::after {
    opacity: 1;
  }

  /* Focus indicator for accessibility */
  .dot:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .r-name {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--fg);
    line-height: 1.1;
  }
  .r-role { margin-top: 8px; font-size: 15px; color: var(--accent); font-weight: 500; }
  .r-tag  { margin-top: 12px; font-size: 15px; color: var(--dim); max-width: 60ch; line-height: 1.6; }
  .r-sec  { margin-top: 32px; }
  .r-h {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .r-h .copy-link {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    cursor: pointer;
    color: var(--dim);
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: opacity 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  .r-h:hover .copy-link { opacity: 1; }
  .r-h .copy-link:hover { color: var(--accent); background: var(--bg-bar); }
  .r-h .copy-link.copied { color: var(--accent); }
  .r-body { font-size: 15px; line-height: 1.8; color: var(--fg); max-width: 66ch; }
  .r-skills, .r-links { list-style: none; }
  .r-skills li {
    display: flex; gap: 14px; padding: 8px 0; flex-wrap: wrap;
    border-bottom: 1px dashed var(--border);
  }
  .r-skills li:last-child { border-bottom: none; }
  .r-k { color: var(--yellow); font-weight: 700; flex: 0 0 150px; }
  .r-v { color: var(--fg); }
  .r-links li { display: flex; gap: 14px; padding: 8px 0; flex-wrap: wrap; align-items: baseline; }
  .r-lk { color: var(--magenta); font-weight: 700; flex: 0 0 90px; }
  .r-sub { font-size: 13px; color: var(--dim); margin: -8px 0 14px; }
  .r-strengths { list-style: none; counter-reset: s; }
  .r-strengths li {
    counter-increment: s;
    display: flex; gap: 12px; padding: 8px 0; flex-wrap: wrap; align-items: baseline;
    border-bottom: 1px dashed var(--border);
  }
  .r-strengths li:last-child { border-bottom: none; }
  .r-strengths li::before {
    content: counter(s) ".";
    color: var(--cyan); font-weight: 700; flex: 0 0 auto; min-width: 16px;
  }
  .r-st { color: var(--yellow); font-weight: 700; flex: 0 0 150px; }
  .r-sd { color: var(--fg); flex: 1; min-width: 220px; }
  .r-cv {
    display: inline-block;
    margin-top: 4px;
    padding: 12px 24px;
    background: var(--accent);
    color: var(--bg-window);
    font-weight: 700;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .r-cv:hover { opacity: 0.9; transform: translateY(-1px); }

  .r-projects { list-style: none; }
  .r-projects li {
    padding: 12px 0;
    border-bottom: 1px dashed var(--border);
  }
  .r-projects li:last-child { border-bottom: none; }
  .r-proj-title { color: var(--cyan); font-weight: 700; font-size: 15px; }
  .r-proj-stack { font-size: 12px; color: var(--magenta); margin: 3px 0 6px; }
  .r-proj-desc { font-size: 14px; color: var(--fg); line-height: 1.7; max-width: 62ch; }
  .r-proj-link { font-size: 13px; margin-top: 6px; }

  .r-testimonials { list-style: none; }
  .r-testimonials li {
    padding: 16px 0;
    border-bottom: 1px dashed var(--border);
  }
  .r-testimonials li:last-child { border-bottom: none; }
  .r-test-name { color: var(--cyan); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .r-test-rel { color: var(--dim); font-weight: 400; font-size: 13px; }
  .r-test-text { font-size: 14px; color: var(--fg); line-height: 1.7; font-style: italic; max-width: 62ch; }
  .r-test-text::before { content: '"'; color: var(--magenta); font-weight: 700; }
  .r-test-text::after { content: '"'; color: var(--magenta); font-weight: 700; }
  .r-test-expand {
    display: block;
    margin: 12px 0;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .r-test-expand:hover {
    background: var(--accent);
    color: var(--bg-window);
  }
  .r-test-cta {
    font-size: 13px;
    color: var(--dim);
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .r-test-cta a { font-weight: 600; }
  .r-test-readmore {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 12px;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }
  .r-test-readmore:hover { opacity: 0.8; }

  /* Guestbook in reader view */
  .r-gb-entries { list-style: none; margin-bottom: 24px; }
  .r-gb-entries li { padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .r-gb-entries li:last-child { border-bottom: none; }
  .r-gb-nick { color: var(--yellow); font-weight: 700; font-size: 14px; }
  .r-gb-date { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .r-gb-msg  { color: var(--fg); font-size: 14px; margin-top: 4px; }
  .r-gb-form { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  .r-gb-form input,
  .r-gb-form textarea {
    background: var(--bg-bar);
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .r-gb-form input:focus,
  .r-gb-form textarea:focus { border-color: var(--accent); }
  .r-gb-form textarea { min-height: 80px; }
  .r-gb-btn {
    background: var(--accent);
    color: var(--bg-window);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    align-self: flex-start;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .r-gb-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .r-gb-status { font-size: 13px; color: var(--accent); }
  .r-gb-status.err { color: var(--red); }
  .r-gb-cta {
    font-size: 14px;
    color: var(--dim);
    margin-bottom: 16px;
    font-style: italic;
  }

  @media (max-width: 600px) {
    .reader { padding: 26px 18px 22px; }
    .r-name { font-size: 30px; }
    .r-k, .r-st { flex-basis: 110px; }
    .r-cv { display: block; text-align: center; }
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .fade-in { animation: fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

  /* =========================================================
     Mobile — full-screen, keyboard-aware
     ========================================================= */
  @media (max-width: 600px) {
    html { height: 100%; }
    body {
      height: 100%;
      padding: 0;
      align-items: stretch;
      justify-content: flex-start;
      background-size: 100% 100%, 30px 30px, 30px 30px;
      overflow: hidden;
    }
    .window {
      width: 100%;
      /* JS will pin this to vv.height via position:fixed so the window
         shrinks exactly when the on-screen keyboard opens */
      border: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
    }
    .bar { padding: 8px 12px; gap: 6px; flex-shrink: 0; }
    .bar .title { font-size: 10px; }
    .dot { width: 10px; height: 10px; }
    .bar-btn { font-size: 10px; padding: 4px 8px; }
    /* Screen fills remaining flex space and scrolls internally */
    .screen {
      font-size: 13px;
      padding: 12px 13px 4px;
      line-height: 1.55;
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .reader {
      flex: 1 1 0;
      min-height: 0;
    }
    .chips { gap: 7px; }
    .chip { font-size: 12.5px; padding: 7px 11px; }
    /* Input row pinned at bottom, above safe area notch */
    .input-row {
      padding: 8px 13px env(safe-area-inset-bottom, 8px);
      gap: 6px;
      border-top-width: 1px;
      flex-shrink: 0;
    }
    #cmdline, .ghost { font-size: 16px; } /* 16px prevents iOS auto-zoom */
    .ps { font-size: 13px; }
    .hint { display: none; }
    .credit { padding: 4px 13px env(safe-area-inset-bottom, 4px); font-size: 10px; flex-shrink: 0; }
    pre.ascii { font-size: 9px; }
  }
  .neofetch-container {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 10px;
  }
  .neofetch-avatar {
    width: 100px;
    height: auto;
    image-rendering: pixelated;
    border: 1px solid var(--border);
    padding: 4px;
    background: var(--bg-bar);
  }
  @media (max-width: 600px) {
    header {
      flex-direction: column-reverse;
      align-items: flex-start !important;
      gap: 15px !important;
    }
  }
</style>
</head>
<body>

// Privacy-first analytics with user opt-out support
async function trackPageView() {
  if (!CONFIG.supabase || !CONFIG.supabase.url) return;
  
  // Respect user opt-out
  if (localStorage.getItem('analytics-opt-out') === 'true') {
    console.debug('[Tracking] User opted out - skipping');
    return;
  }
  
  try {
    const payload = {
      path: window.location.pathname + window.location.hash,
      referrer: document.referrer || null
    };
    
    // Fire and forget - don't block page load
    const url = `${CONFIG.supabase.url}/functions/v1/track-page-view`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    // Log result for debugging (remove after confirmed working)
    const result = await response.json();
    console.debug('[Tracking]', result.success ? '✓ tracked' : '✗ failed', result);
  } catch(e) {
    // Silently fail - tracking shouldn't break the site
    console.debug('Page view tracking failed:', e);
  }
}

function copySectionLink(section, e){

        if (!error && data && data.length) {
          entriesHtml = '<ul class="r-gb-entries">' + data.map(row => {
            const date = new Date(row.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

          }).join('') + '</ul>';
        } else {
          entriesHtml = '<p class="r-gb-status dim" style="margin-bottom:16px;">No entries yet — be the first!</p>';
        }
        container.innerHTML = entriesHtml + `
          <p class="r-gb-cta">Leave a little note before you go — add your digital footprint to this tiny corner of the internet 🌱</p>
          <div class="r-gb-form" id="gb-form">
            <input id="gb-nick" type="text" placeholder="Your nickname (3–20 chars)" maxlength="20" autocomplete="off" />
            <textarea id="gb-msg" placeholder="Leave a message... (2–300 chars)" maxlength="300"></textarea>
            <button class="r-gb-btn" id="gb-submit">Sign guestbook →</button>
            <span class="r-gb-status" id="gb-status" style="display:none;"></span>
          </div>`;
        document.getElementById('gb-submit').addEventListener('click', async () => {
          const nick = (document.getElementById('gb-nick').value || '').trim();
          const msg  = (document.getElementById('gb-msg').value || '').trim();
          const statusEl = document.getElementById('gb-status');
          statusEl.className = 'r-gb-status';
          statusEl.style.display = '';
          if (!nick || nick.length < 3 || nick.length > 20 || !/^[a-zA-Z0-9 _-]+$/.test(nick)) {
            statusEl.textContent = 'Nickname must be 3–20 chars: letters, numbers, spaces, _ or -';
            statusEl.classList.add('err'); return;
          }
          if (!isClean(nick)) { statusEl.textContent = 'That nickname isn\'t allowed.'; statusEl.classList.add('err'); return; }
          if (!msg || msg.length < 2) { statusEl.textContent = 'Message too short (min 2 chars).'; statusEl.classList.add('err'); return; }
          if (msg.length > 300) { statusEl.textContent = 'Message too long (max 300 chars).'; statusEl.classList.add('err'); return; }
          if (!isClean(msg)) { statusEl.textContent = 'That message isn\'t allowed.'; statusEl.classList.add('err'); return; }
          statusEl.textContent = 'Submitting...';
          try {
            const data = await edgeFn('post-guestbook', { method: 'POST', body: JSON.stringify({ nickname: nick, message: msg }) });
            if (data.error) { statusEl.textContent = 'Error: ' + data.error; statusEl.classList.add('err'); }
            else { statusEl.textContent = '✓ Message saved! Thanks for signing.'; document.getElementById('gb-nick').value = ''; document.getElementById('gb-msg').value = ''; }
          } catch(e) { statusEl.textContent = 'Failed: ' + e.message; statusEl.classList.add('err'); }
        });
      });
  } else {
    container.innerHTML = '<p class="r-gb-status err">Guestbook unavailable (Supabase not configured).</p>';
  }
}

// ── Window State Management ──────────────────────────────
let windowState = 'normal'; // 'normal' | 'minimized' | 'maximized' | 'closed'

function setWindowState(state) {
  windowState = state;
  const win = document.getElementById('window');
  win.classList.remove('minimized', 'maximized', 'closed');
  if (state !== 'normal') win.classList.add(state);
  try { localStorage.setItem('window-state', state); } catch(e) {}
}

function restoreWindow() {
  setWindowState('normal');
  document.body.style.cursor = '';
  document.body.title = '';
  document.body.style.pointerEvents = '';
}

// 🔴 CLOSE: Hide window completely (shows blank page)
document.getElementById('dotClose').addEventListener('click', (e) => {
  e.stopPropagation();
  setWindowState('closed');
  // Show a subtle "click to restore" message on body
  document.body.style.cursor = 'pointer';
  document.body.title = 'Click anywhere to restore terminal';
  // Add click listener to body with setTimeout to avoid immediate trigger
  setTimeout(() => {
    document.body.addEventListener('click', restoreWindow, { once: true });
  }, 100);
});

// 🟡 MINIMIZE: Collapse to title bar only
document.getElementById('dotMinimize').addEventListener('click', (e) => {
  e.stopPropagation();
  if (windowState === 'minimized') {
    restoreWindow();
  } else {
    setWindowState('minimized');
    // Click bar to restore
    setTimeout(() => {
      document.querySelector('.bar').addEventListener('click', restoreWindow, { once: true });
    }, 100);
  }
});

// 🟢 MAXIMIZE: Fill screen
document.getElementById('dotMaximize').addEventListener('click', (e) => {
  e.stopPropagation();
  if (windowState === 'maximized') {
    setWindowState('normal'); // toggle back
  } else {
    setWindowState('maximized');
  }
});

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ponytail: truncate at ~250 chars but break at next space to avoid mid-word cuts */
function truncateAtWord(s, maxLen){
  if (s.length <= maxLen) return s;
  const cutoff = s.lastIndexOf(' ', maxLen);
  return cutoff > maxLen * 0.7 ? s.substring(0, cutoff) + '...' : s.substring(0, maxLen) + '...';
}

/* Sanitize guestbook messages: strip URLs and obfuscate domain patterns */
function sanitizeGuestbook(s){
  return String(s)
    .replace(/https?:\/\/[^\s<]+/gi, '[link removed]')
    .replace(/www\.[^\s<]+/gi, '[link removed]')
    .replace(/\b[a-zA-Z0-9._%+-]+\.[a-z]{2,}\b/gi, match => {
      // Obfuscate .com, .org, .net, etc. to prevent clickable links
      return match.replace(/\./g, '[.]');
    });
}

/* =========================================================
   Math evaluator — safe subset: + - * / % ( ) and spaces
   ========================================================= */
function tryMath(raw) {
  const expr = raw.trim();
  if (!/^[\d\s\+\-\*\/\%\.\(\)]+$/.test(expr)) return null;
  if (!/[\+\-\*\/\%]/.test(expr)) return null;
  try {
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + expr + ')')();
    if (typeof result === 'number' && isFinite(result)) return result;
  } catch(e) {}
  return null;
}

  cd(args){
    const argv = (args || '').trim().split(/\s+/).filter(Boolean);
    const target = argv[0] || '~';
    
    // Handle special cases
    if (target === '~' || target === '$HOME') {
      currentDir = '/home/emily/portfolio';
      return;
    }
    if (target === '-') {
      print('<span class="yellow">cd: OLDPWD not set</span>');
      return;
    }
    if (target === '..') {
      if (currentDir === '/home/emily/portfolio') {
        currentDir = '/home/emily';
      } else if (currentDir === '/home/emily') {
        currentDir = '/home';
      } else if (currentDir === '/home') {
        currentDir = '/';
      }
      return;
    }
    
    // Directory structure
    const dirs = {
      '/home/emily/portfolio': ['projects', 'skills', 'experience', 'quotes', 'dadjokes'],
      '/home/emily/portfolio/projects': ['terminal-portfolio', 'postgresql-calculator', 'convert-utc-bot'],
      '/home/emily': ['emily'],
      '/home': ['emily'],
      '/': ['home', 'etc', 'var', 'tmp'],
    };
    
    // Handle relative paths
    let newPath;
    if (target.startsWith('/')) {
      newPath = target;
    } else if (target === '.' || target === './') {
      return;
    } else {
      newPath = currentDir === '/' ? '/' + target : currentDir + '/' + target;
    }
    
    // Normalize path (remove trailing slashes, handle double slashes)
    newPath = newPath.replace(/\/+/g, '/').replace(/\/$/, '') || '/';
    
    // Check if directory exists
    if (dirs[newPath] || target === '..') {
      currentDir = newPath;
    } else if (dirs[currentDir] && dirs[currentDir].includes(target)) {
      currentDir = currentDir === '/' ? '/' + target : currentDir + '/' + target;
    } else {
      print(`<span class="yellow">cd: ${escapeHtml(target)}: No such directory</span>`);
    }
  },

  async _startQuiz(sub){
    let category = null, difficulty = null, label = 'Mixed';
    if (sub === 'emily') { category = 'emily'; label = 'Emily (exclusive)'; }
    else if (sub === 'easy' || sub === 'medium' || sub === 'hard') { difficulty = sub; label = sub.charAt(0).toUpperCase() + sub.slice(1); }
    else if (sub === 'mixed' || sub === '4') { label = 'Mixed'; }
    else if (sub === '1') { difficulty = 'easy';   label = 'Easy'; }
    else if (sub === '2') { difficulty = 'medium'; label = 'Medium'; }
    else if (sub === '3') { difficulty = 'hard';   label = 'Hard'; }
    else if (sub === '5') { category = 'emily';    label = 'Emily (exclusive)'; }
    else if (sub) { category = sub; label = sub.charAt(0).toUpperCase() + sub.slice(1); }
    print(`<span class="dim">$ starting trivia quiz...</span>`);
    print('<span class="dim">Fetching questions from database...</span>');
    try {
      let url = 'start-quiz';
      const params = [];
      if (category)  params.push(`category=${encodeURIComponent(category)}`);
      if (difficulty) params.push(`difficulty=${encodeURIComponent(difficulty)}`);
      if (params.length) url += '?' + params.join('&');
      const data = await edgeFn(url, { method: 'POST' });
      if (data.error) { print(`<span class="red">Error: ${escapeHtml(data.error)}</span>`); return; }
      quizState.active = true; quizState.phase = 'playing';
      quizState.sessionId = data.sessionId; quizState.questions = data.questions;
      quizState.currentQ = 0; quizState.answers = []; quizState.startTime = Date.now();
      quizState.quizCategory = data.category || category || 'mixed';
      quizState.quizDifficulty = data.difficulty || difficulty || 'mixed';
      blank();
      print(`<span class="accent b">Trivia Quiz</span> <span class="dim">— ${data.questions.length} questions | ${label}</span>`);
      print('<span class="dim">Type a, b, c, or d to answer. Type quit to abandon.</span>');
      blank();
      showQuizQuestion();
    } catch(e) { print(`<span class="red">Failed to start quiz: ${escapeHtml(e.message)}</span>`); }

/* =========================================================
   Autocomplete + fuzzy matching
   ========================================================= */
const COMMANDS = Object.keys(commands);
const ghost = document.getElementById('ghost');
const hint  = document.getElementById('hint');

function fuzzyScore(query, target){
  query = query.toLowerCase(); target = target.toLowerCase();
  if (!query) return 0;
  let qi = 0, score = 0, prev = -2;
  for (let ti = 0; ti < target.length && qi < query.length; ti++){
    if (target[ti] === query[qi]){
      score += 1;
      if (ti === 0) score += 6;
      if (ti === prev + 1) score += 4;
      prev = ti; qi++;
    }
  }
  if (qi < query.length) return -1;
  score -= (target.length - query.length) * 0.15;
  return score;
}

function getMatches(input){
  const q = (input || '').trim().toLowerCase();
  if (!q) return [];
  return COMMANDS
    .map(name => ({ name, score: fuzzyScore(q, name), prefix: name.startsWith(q) }))
    .filter(m => m.score >= 0)
    .sort((a, b) => (b.prefix - a.prefix) || (b.score - a.score) || (a.name.length - b.name.length));
}

function updateGhost(){
  const v = cmdline.value;
  const m = getMatches(v);
  ghost.innerHTML = ''; hint.innerHTML = '';
  if (!v.trim() || !m.length) return;
  const best = m[0];
  if (best.prefix && best.name !== v.trim().toLowerCase()){
    ghost.innerHTML = `<span class="gt">${escapeHtml(v)}</span>${escapeHtml(best.name.slice(v.length))}`;
    hint.innerHTML = '<span class="dim">↹ tab</span>';
  } else if (!best.prefix){
    hint.innerHTML = `<span class="dim">↹ ${escapeHtml(best.name)}?</span>`;
  }
}

let tab = { active: false, list: [], idx: -1 };
function onTab(){
  if (!tab.active){
    const m = getMatches(cmdline.value);
    if (!m.length) return;
    tab = { active: true, list: m.map(x => x.name), idx: -1 };
  }
  tab.idx = (tab.idx + 1) % tab.list.length;
  cmdline.value = tab.list[tab.idx];
  updateGhost();
}

function resolve(raw){
  const v = (raw || '').trim().toLowerCase();
  if (!v) return null;
  const mathResult = tryMath(v);
  if (mathResult !== null) return { name: '__math__', result: mathResult };
  const easterKeys = Object.keys(EASTER_EGGS).sort((a,b) => b.length - a.length);
  for (const ek of easterKeys) {
    if (v === ek || v.startsWith(ek + ' ')) {
      return { name: EASTER_EGGS[ek], corrected: false, easter: true };
    }
  }
  if (commands[v]) return { name: v, corrected: false };
  const firstWord = v.split(/\s+/)[0];
  if (firstWord !== v && commands[firstWord]) return { name: firstWord, corrected: false, hasArgs: true };
  const m = getMatches(v);
  return m.length ? { name: m[0].name, corrected: true } : null;
}

function runCommand(raw){
  const cmd = (raw || '').trim();
  
  // Handle !! (repeat last command)
  if (cmd === '!!' && commandHistory.length > 0) {
    const lastCmd = commandHistory[commandHistory.length - 1];
    printPromptEcho('!!');
    print('<span class="dim">' + escapeHtml(lastCmd) + '</span>');
    runCommand(lastCmd);
    return;
  }
  
  printPromptEcho(cmd);
  if (!cmd) return;
  if (quizState.tailInterval) { clearInterval(quizState.tailInterval); quizState.tailInterval = null; }
  
  // Add to history
  if (cmd !== 'history' && cmd !== 'clear') {
    commandHistory.push(cmd);
    historyIndex = -1;
  }

  const r = resolve(cmd);
  if (r){
    if (r.name === '__math__') {
      const val = Number.isInteger(r.result) ? r.result : parseFloat(r.result.toPrecision(12));
      print(`<span class="accent">${escapeHtml(String(val))}</span>`);
    } else {
      if (r.corrected) print(`<span class="dim">≈ assuming <span class="accent">${escapeHtml(r.name)}</span></span>`);
      const cmdFn = commands[r.name];
      if (cmdFn) {
        const args = cmd.toLowerCase().replace(new RegExp('^' + r.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*'), '');
        cmdFn(args || undefined);
      }
    }
  } else {
    print(`<span class="red">command not found: ${escapeHtml(cmd)}</span> — type <span class="accent">help</span>`);
  }
  blank();
}

cmdline.addEventListener('input', () => { tab.active = false; updateGhost(); });
cmdline.addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); onTab(); return; }
  if (e.key === 'ArrowRight' && cmdline.selectionStart === cmdline.value.length){
    const m = getMatches(cmdline.value);
    if (m.length && m[0].prefix && m[0].name !== cmdline.value.trim().toLowerCase()){
      e.preventDefault(); cmdline.value = m[0].name; tab.active = false; updateGhost(); return;
    }
  }
  if (e.key === 'Enter'){
    const v = cmdline.value;
    cmdline.value = ''; tab.active = false; updateGhost();

    if (quizState.phase === 'picking') {
      const pick = v.trim().toLowerCase();
      printPromptEcho(pick);
      if (['1','2','3','4','5','easy','medium','hard','mixed','emily'].includes(pick)) { quizState.phase = 'idle'; commands._startQuiz(pick); }
      else if (pick === 'quit' || pick === 'cancel') { quizState.phase = 'idle'; print('<span class="dim">Cancelled.</span>'); }
      else { print('<span class="yellow">Pick 1–5, or type easy / medium / hard / mixed / emily</span>'); }
      return;
    }

    if (quizState.phase === 'playing') {
      const ans = v.trim().toLowerCase();
      if (ans === 'quit') { printPromptEcho('quit'); print('<span class="yellow">Quiz abandoned.</span>'); resetQuizState(); blank(); }
      else if (['a','b','c','d'].includes(ans)) { printPromptEcho(ans); submitQuizAnswer(ans); }
      else { printPromptEcho(v); print('<span class="yellow">Type a, b, c, or d to answer. Type quit to abandon.</span>'); }
      return;
    }

    if (quizState.phase === 'nickname') {
      const nick = v.trim(); printPromptEcho(nick);
      if (!nick || nick.length < 3 || nick.length > 20 || !/^[a-zA-Z0-9 _-]+$/.test(nick)) { print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>'); return; }
      if (!isClean(nick)) { print('<span class="yellow">That nickname isn\'t allowed.</span>'); return; }
      finishQuiz(nick); return;
    }

    if (quizState.phase === 'review') {
      const ans = v.trim().toLowerCase();
      printPromptEcho(ans);
      if (ans === '' || ans === 'y' || ans === 'yes') {
        showWrongAnswers();
      } else {
        print('<span class="dim">Skipping review.</span>');
        blank();
        print('<span class="dim">Type <span class="accent">leaderboard</span> to see the rankings!</span>');
      }
      quizState.phase = 'done';
      resetQuizState();
      return;
    }

    if (quizState.gbStep === 'nickname') {
      const nick = v.trim(); printPromptEcho(nick);
      if (!nick || nick.length < 3 || nick.length > 20 || !/^[a-zA-Z0-9 _-]+$/.test(nick)) { print('<span class="yellow">Nickname must be 3–20 chars: letters, numbers, spaces, _ or -</span>'); return; }
      if (!isClean(nick)) { print('<span class="yellow">That nickname isn\'t allowed.</span>'); return; }
      quizState.gbNickname = nick; quizState.gbStep = 'message';
      print('Enter your message (2–300 chars):'); return;
    }
    if (quizState.gbStep === 'message') {
      const msg = v.trim(); printPromptEcho(msg);
      if (!msg || msg.length < 2) { print('<span class="yellow">Message too short (min 2 chars).</span>'); return; }
      if (msg.length > 300) { print('<span class="yellow">Message too long (max 300 chars).</span>'); return; }
      if (!isClean(msg)) { print('<span class="yellow">That message isn\'t allowed.</span>'); return; }
      quizState.gbMessage = msg; submitGuestbook(); return;
    }

    if (v.trim()) { commandHistory.push(v); historyIndex = commandHistory.length; }
    runCommand(v);
  } else if (e.key === 'ArrowUp'){
    if (historyIndex > 0){ historyIndex--; cmdline.value = commandHistory[historyIndex]; tab.active = false; updateGhost(); e.preventDefault(); }
  } else if (e.key === 'ArrowDown'){
    if (historyIndex < commandHistory.length-1){ historyIndex++; cmdline.value = commandHistory[historyIndex]; }
    else { historyIndex = commandHistory.length; cmdline.value = ''; }
    tab.active = false; updateGhost();
  }
});

const win = document.getElementById('window');
win.addEventListener('click', e => {
  if (root.getAttribute('data-view') !== 'terminal') return;
  if (e.target.closest('a, button, input, textarea')) return;
  cmdline.focus();
});

/* =========================================================
   Mobile keyboard handling — visual viewport pinning
   =========================================================
   Problem: when the on-screen keyboard opens, browsers either
   (a) shrink the layout viewport (Chrome/Android) or
   (b) keep the layout viewport and shift it (Safari/iOS).
   In both cases window.visualViewport reflects the true
   visible area. We pin the .window to that rectangle so it
   always fills exactly the available space, and we scroll
   the .screen to the bottom so the latest output stays in view.
   ========================================================= */
const vv = window.visualViewport;

function fitToViewport() {
  if (window.innerWidth > 600) {
    /* Desktop: let CSS handle sizing, clear any JS overrides */
    win.style.position = '';
    win.style.top      = '';
    win.style.left     = '';
    win.style.width    = '';
    win.style.height   = '';
    return;
  }

  if (vv) {
    /* Pin window to the visual viewport's current position and size.
       This handles both shrink-viewport (Chrome) and shift-viewport
       (Safari) keyboard behaviours in one shot. */
    win.style.position = 'fixed';
    win.style.top      = vv.offsetTop  + 'px';
    win.style.left     = vv.offsetLeft + 'px';
    win.style.width    = vv.width      + 'px';
    win.style.height   = vv.height     + 'px';
  } else {
    /* Fallback for browsers without visualViewport API */
    win.style.position = 'fixed';
    win.style.top      = '0';
    win.style.left     = '0';
    win.style.width    = '100%';
    win.style.height   = window.innerHeight + 'px';
  }

  /* Always keep latest terminal output visible */
  if (root.getAttribute('data-view') === 'terminal') {
    screen.scrollTop = screen.scrollHeight;
  }
}

if (vv) {
  vv.addEventListener('resize', fitToViewport);
  vv.addEventListener('scroll', fitToViewport);
}
window.addEventListener('resize',            fitToViewport);
window.addEventListener('orientationchange', () => setTimeout(fitToViewport, 300));
fitToViewport();

cmdline.addEventListener('focus', () => {
  /* Two-pass: fire once immediately (for browsers that resize before focus
     completes) and again after the keyboard animation finishes (~300–400 ms). */
  setTimeout(() => { fitToViewport(); screen.scrollTop = screen.scrollHeight; }, 100);
  setTimeout(() => { fitToViewport(); screen.scrollTop = screen.scrollHeight; }, 420);
});

/* =========================================================
   Boot sequence
   ========================================================= */
let skip = false;
const isMobile = () => window.innerWidth <= 600;
/* Typing speed per character — comfortably readable on mobile */
const CHAR_MS = () => isMobile() ? 55 : 16;

function typeLine(text, cls){
  return new Promise(res => {
    const node = print('', cls);
    const cursor = el('span','cursor');
    node.appendChild(cursor);
    let i = 0;
    (function step(){
      if (skip){ node.innerHTML = text; res(); return; }
      if (i <= text.length){
        node.innerHTML = text.slice(0,i);
        node.appendChild(cursor);
        screen.scrollTop = screen.scrollHeight;
        i++;
        setTimeout(step, CHAR_MS());
      } else { node.innerHTML = text; res(); }
    })();
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, skip ? 0 : ms)); }

/* Print a line then pause so the reader can absorb it before the next appears.
   Optional `pause` arg overrides the default mobile delay. */
function printLine(html, cls, pause){
  print(html, cls);
  screen.scrollTop = screen.scrollHeight;
  const ms = pause !== undefined ? pause : (isMobile() ? 1000 : 0);
  return ms > 0 ? wait(ms) : Promise.resolve();
}

async function boot(){
  buildReader();
  const date = new Date().toString().replace(/ GMT.*/, '');
  print(`<span class="dim">Last login: ${date} on ttys001</span>`);
  blank();
  await typeLine(`${CONFIG.user}@${CONFIG.host}:~$ whoami`, '');
  await wait(isMobile() ? 500 : 180);
  commands.whoami();
  blank();
  await wait(isMobile() ? 600 : 0);
  await typeLine(`${CONFIG.user}@${CONFIG.host}:~$ ./welcome.sh`, '');
  await wait(isMobile() ? 500 : 180);

  /* On mobile: print each about line individually with a generous pause so
     the screen doesn't flood and the user can read one chunk at a time.
     On desktop: keep the original instant render. */
  if (isMobile()) {
    await printLine(`<span class="accent b">${CONFIG.name}</span> <span class="dim">—</span> <span class="cyan">${CONFIG.role}</span>`, '', 700);
    await printLine(`<span class="dim">// ${CONFIG.tagline}</span>`, '', 1100);
    blank();
    for (const line of CONFIG.about) {
      await printLine(line, '', 1300);
    }
    await wait(500);
    blank();
    print(`Type <span class="accent">cv</span> to read my full résumé, or <span class="accent">contact</span> to reach me.`, 'dim');
  } else {
    commands.about();
  }

  blank();
  await wait(isMobile() ? 700 : 0);
  print('<span class="dim">Tip: tap a chip below, or type a command ↓</span>');
  if (!isMobile()) {
    print('<span class="dim">New to terminals? Click <span class="accent">▤ reader view</span> (top-right) for a plain page.</span>');
  }
  await wait(isMobile() ? 500 : 0);

  // Show chips only (no help output on first run)
  renderChips();

  blank();
  
  // Privacy notice for terminal view (GDPR/CCPA compliant)
  print('<span class="dim" style="font-size: 11px;">🔒 Privacy: This site uses anonymous analytics (no cookies, no personal data). Type <span class="accent">privacy</span> to learn more or opt out.</span>');
  
  inputRow.style.display = 'flex';
  fitToViewport();
  if (window.innerWidth > 600) cmdline.focus();
  
  // Restore window state from localStorage
  const savedState = localStorage.getItem('window-state');
  if (savedState && ['minimized', 'maximized'].includes(savedState)) {
    setWindowState(savedState);
    
    // If minimized, add click handler to bar
    if (savedState === 'minimized') {
      document.querySelector('.bar').addEventListener('click', restoreWindow, { once: true });
    }
  }
  
  // Mobile: hide maximize button (already full-screen)
  if (window.innerWidth <= 768) {
    document.getElementById('dotMaximize').style.display = 'none';
  }
}

function armSkip(){
  const onSkip = () => { skip = true; };
  window.addEventListener('keydown', onSkip, { once:true });
  screen.addEventListener('click', onSkip, { once:true });
}

/* DevTools easter egg */
(function(){
  let devtoolsOpen = false;
  const threshold = 160;
  function onDevToolsOpen(){
    if (devtoolsOpen) return;
    devtoolsOpen = true;
    console.log('%cHello World! 👋\n%cI see you\'re peeking into my code.\n\nIf you\'re a developer, I\'d love to chat!\nhttps://linkedin.com/in/memilyc', 'color:#7ec699;font-size:24px;font-weight:bold;', 'color:#e6b450;font-size:14px;');
  }
  function checkSize(){ if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) onDevToolsOpen(); }
  setInterval(checkSize, 1000);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'I') setTimeout(onDevToolsOpen, 500); if (e.key === 'F12') setTimeout(onDevToolsOpen, 500); });
  
  // Window control keyboard shortcuts
  document.addEventListener('keydown', e => {
    // Esc = toggle close/restore (only when not typing)
    if (e.key === 'Escape' && !cmdline.matches(':focus')) {
      e.preventDefault();
      e.stopPropagation();
      if (windowState === 'normal') {
        setWindowState('closed');
        document.body.style.cursor = 'pointer';
        document.body.title = 'Click anywhere to restore terminal';
        setTimeout(() => {
          document.body.addEventListener('click', restoreWindow, { once: true });
        }, 100);
      } else {
        restoreWindow();
      }
    }
    
    // Cmd/Ctrl + M = minimize
    if ((e.metaKey || e.ctrlKey) && e.key === 'm' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (windowState === 'minimized') {
        restoreWindow();
      } else {
        setWindowState('minimized');
        setTimeout(() => {
          document.querySelector('.bar').addEventListener('click', restoreWindow, { once: true });
        }, 100);
      }
    }
    
    // Cmd/Ctrl + F = fullscreen/maximize
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      e.preventDefault();
      e.stopPropagation();
      setWindowState(windowState === 'maximized' ? 'normal' : 'maximized');
    }
  });
  document.addEventListener('contextmenu', () => { setTimeout(() => { if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) onDevToolsOpen(); }, 800); });
})();

armSkip();
boot();

/* Track page view */
trackPageView();

/* Scroll to section if URL has hash */
if (window.location.hash && root.getAttribute('data-view') === 'reader') {
  setTimeout(() => {
    const el = document.querySelector(window.location.hash);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
